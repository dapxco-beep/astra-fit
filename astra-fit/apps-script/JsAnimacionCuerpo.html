<!--
  JsAnimacionCuerpo.html — Da vida a la figura de anatomía del monitoreo (SeccionMonitoreo.html) sin tocar su código.
  Se engancha a lo que ya dibuja esa sección: .mon-cuerpo (la figura), .mon-musculo (cada músculo), .mon-relleno, .mon-guia y .mon-led-pulso.

    - La figura se inclina en 3D siguiendo el cursor y, sin cursor encima, se mece despacio (como si respirara).
    - Cada músculo late con su propio ritmo y proyecta un halo del color de su riesgo; el elegido, más fuerte y con luz azul.
    - Una línea de escaneo recorre el cuerpo de arriba abajo.
    - La guía del músculo elegido tiene un flujo que va hacia su etiqueta.
    - Los músculos aparecen uno tras otro al dibujar la figura, y los LED de los sensores laten suave.

  Todo se apaga si el sistema pide menos movimiento, y se pausa cuando la figura no se ve.
-->
<style>
@media (prefers-reduced-motion: no-preference) {
  .mon-cuerpo { will-change: transform; }
  .mon-cuerpo .mon-barrido { position: absolute; left: 4%; right: 4%; top: 0; height: 3px; border-radius: 2px; pointer-events: none; opacity: 0;
    background: linear-gradient(90deg, transparent, var(--azul), transparent); box-shadow: 0 0 14px 2px var(--azul); animation: monBarrido 7s cubic-bezier(.4, 0, .6, 1) infinite; }
  @keyframes monBarrido { 0% { top: 4%; opacity: 0; } 8% { opacity: .5; } 50% { top: 96%; opacity: .5; } 58%, 100% { top: 96%; opacity: 0; } }
  .mon-cuerpo .mon-musculo.es-activo .mon-guia { stroke-dasharray: 5 4; animation: monFlujo 1s linear infinite; }
  .mon-cuerpo .mon-musculo.esta-midiendo .mon-guia { stroke: var(--azul); stroke-dasharray: 5 4; animation: monFlujo .6s linear infinite; }
  @keyframes monFlujo { to { stroke-dashoffset: -9; } }
  .mon-cuerpo .mon-musculo { animation: monAparece .7s ease-out both; }
  .mon-cuerpo .mon-musculo:nth-of-type(1) { animation-delay: .05s; } .mon-cuerpo .mon-musculo:nth-of-type(2) { animation-delay: .15s; } .mon-cuerpo .mon-musculo:nth-of-type(3) { animation-delay: .25s; }
  .mon-cuerpo .mon-musculo:nth-of-type(4) { animation-delay: .35s; } .mon-cuerpo .mon-musculo:nth-of-type(5) { animation-delay: .45s; } .mon-cuerpo .mon-musculo:nth-of-type(6) { animation-delay: .55s; }
  @keyframes monAparece { from { opacity: 0; } to { opacity: 1; } }
  .mon-cuerpo .mon-led-pulso { animation: pulso 2.6s ease-out infinite; }
  .mon-cuerpo .mon-musculo:nth-of-type(2n) .mon-led-pulso { animation-delay: .9s; } .mon-cuerpo .mon-musculo:nth-of-type(3n) .mon-led-pulso { animation-delay: 1.7s; }
  .mon-cuerpo .mon-musculo.esta-midiendo .mon-led-pulso { animation-duration: 1.2s; animation-delay: 0s; }
}
</style>
<script>
(() => {
  const reducir = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reducir) return;
  const inc = { x: 0, y: 0, tx: 0, ty: 0, ultimo: -1e9 };
  let visible = false, observada = null;
  const t0 = performance.now();

  function enganchar() {
    const cuerpo = document.querySelector('.mon-cuerpo'); if (!cuerpo || cuerpo === observada) return;
    observada = cuerpo;
    if (!cuerpo.querySelector('.mon-barrido')) { const b = document.createElement('i'); b.className = 'mon-barrido'; b.setAttribute('aria-hidden', 'true'); cuerpo.appendChild(b); }
    const tarjeta = cuerpo.closest('.tarjeta') || cuerpo;
    tarjeta.addEventListener('pointermove', (e) => {
      const r = cuerpo.getBoundingClientRect();
      inc.ty = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width - .5) * 2)) * 7; inc.tx = -Math.max(-1, Math.min(1, ((e.clientY - r.top) / r.height - .5) * 2)) * 3.5; inc.ultimo = performance.now();
    });
    tarjeta.addEventListener('pointerleave', () => { inc.ultimo = -1e9; });
    new IntersectionObserver((en) => { visible = en[0].isIntersecting; }).observe(cuerpo);
  }

  function cuadro(ahora) {
    requestAnimationFrame(cuadro);
    enganchar();
    if (!observada || !visible || document.hidden) return;
    const t = (ahora - t0) / 1000;
    // Inclinación en 3D: con el cursor encima sigue al cursor; si no, se mece
    if (ahora - inc.ultimo > 1500) { inc.ty = Math.sin(t * .5) * 3.2; inc.tx = Math.sin(t * .37 + 1) * 1.2; }
    inc.x += (inc.tx - inc.x) * .07; inc.y += (inc.ty - inc.y) * .07;
    observada.style.transform = `perspective(1500px) rotateX(${inc.x.toFixed(2)}deg) rotateY(${inc.y.toFixed(2)}deg)`;
    // Cada músculo late con su ritmo y proyecta un halo del color de su riesgo
    observada.querySelectorAll('.mon-musculo').forEach((g, i) => {
      const r = g.querySelector('.mon-relleno'); if (!r) return;
      const activo = g.classList.contains('es-activo'), midiendo = g.classList.contains('esta-midiendo');
      const onda = .5 + .5 * Math.sin(t * (midiendo ? 7 : 1.9) + i * 1.3), pulso = Math.pow(onda, 2);
      const color = r.getAttribute('fill') || '#aeaeb2';
      const halo = (activo || midiendo ? 4 : 1.5) + (activo || midiendo ? 9 : 4.5) * pulso;
      r.style.filter = `${activo || midiendo ? 'drop-shadow(0 0 2px #0071e3) ' : ''}drop-shadow(0 0 ${halo.toFixed(1)}px ${color})`;
      r.style.opacity = String(((activo || midiendo) ? .86 : .74) + .14 * pulso);
    });
  }
  requestAnimationFrame(cuadro);
})();
</script>
