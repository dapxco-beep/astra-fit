<!-- SeccionEntorno.html — Lógica del exterior que se ve en el encabezado oscuro de SeccionInicio.html:
     escena animada (órbita, Luna o Marte), días desde el despegue, gravedad, temperatura y duración del día.
     Escucha "astronauta-elegido" y "astronauta-actualizado".  Datos de cada entorno en Calc.ENTORNOS (JsCalculos.html), con sus fuentes. -->
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const sinMovimiento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let entornoVisto = 'orbita';

  /* ---------- Estrellas fijas (siempre las mismas posiciones) ---------- */
  let semilla = 7;
  const azar = () => ((semilla = (semilla * 9301 + 49297) % 233280) / 233280);
  $('escena-estrellas').innerHTML = Array.from({ length: 110 }, () =>
    `<circle cx="${(azar() * 1000).toFixed(0)}" cy="${(azar() * 600 - 280).toFixed(0)}" r="${(azar() * 1.3 + 0.3).toFixed(1)}" fill="#fff" opacity="${(azar() * 0.6 + 0.2).toFixed(2)}"/>`).join('');

  /* ---------- Una escena por entorno ---------- */
  const ESCENAS = {
    orbita: `
      <circle cx="640" cy="760" r="520" fill="url(#g-tierra)"/>
      <circle cx="640" cy="760" r="528" fill="none" stroke="#5ac8fa" stroke-opacity=".35" stroke-width="10"/>
      <ellipse cx="640" cy="250" rx="420" ry="70" fill="none" stroke="#fff" stroke-opacity=".22" stroke-dasharray="3 8"/>
      <g class="estacion" ${sinMovimiento ? 'transform="translate(640 320)"' : ''}>
        <rect x="-16" y="-3" width="32" height="6" rx="2" fill="#f5f5f7"/><rect x="-4" y="-9" width="8" height="18" rx="2" fill="#d1d1d6"/>
        ${sinMovimiento ? '' : '<animateMotion dur="24s" repeatCount="indefinite" path="M1060,250 a420,70 0 1,1 -840,0 a420,70 0 1,1 840,0"/>'}
      </g>`,
    luna: `
      <circle cx="840" cy="105" r="34" fill="url(#g-tierra)"/>
      <circle cx="500" cy="1250" r="1000" fill="url(#g-luna)"/>
      <ellipse cx="300" cy="330" rx="60" ry="10" fill="#000" opacity=".15"/><ellipse cx="760" cy="300" rx="36" ry="7" fill="#000" opacity=".15"/><ellipse cx="560" cy="380" rx="90" ry="14" fill="#000" opacity=".12"/>
      <g transform="translate(430 268)"><circle class="pulso" r="26" fill="none" stroke="#fff"/><path d="M-22 0 a22 22 0 0 1 44 0z" fill="#f5f5f7"/><rect x="-28" y="0" width="56" height="5" rx="2" fill="#aeaeb2"/></g>`,
    marte: `
      <circle cx="860" cy="90" r="16" fill="#fff4d6" opacity=".9"/>
      <circle cx="500" cy="1240" r="1000" fill="url(#g-marte)"/>
      <path d="M0 300 Q 180 270 330 292 T 700 282 T 1000 296 L1000 420 L0 420z" fill="#8f3a1c" opacity=".5"/>
      <g transform="translate(560 282)"><circle class="pulso" r="26" fill="none" stroke="#fff"/><path d="M-22 0 a22 22 0 0 1 44 0z" fill="#f5f5f7"/><rect x="-28" y="0" width="56" height="5" rx="2" fill="#aeaeb2"/></g>`
  };

  /* ---------- Contador de días (anima solo una vez por cambio) ---------- */
  function contar(el, hasta) {
    if (sinMovimiento || hasta <= 0) { el.textContent = Calc.numero(hasta, 0); return; }
    const inicio = performance.now(), dur = 900;
    const paso = (t) => {
      const p = Math.min(1, (t - inicio) / dur);
      el.textContent = Calc.numero(Math.round(hasta * (1 - Math.pow(1 - p, 3))), 0);
      if (p < 1) requestAnimationFrame(paso);
    };
    requestAnimationFrame(paso);
  }

  /* ---------- Pintar un entorno ---------- */
  const T_MIN = -200, T_MAX = 150;
  const posT = (t) => ((t - T_MIN) / (T_MAX - T_MIN)) * 100;

  function pintar(clave) {
    const a = Sesion.astronauta;
    const e = Calc.ENTORNOS[clave] || Calc.ENTORNOS.orbita;
    const propio = (a && a.entorno) || 'orbita';
    entornoVisto = clave;

    document.getElementById('inicio').dataset.entorno = clave;   // cambia el color del cielo del encabezado
    $('escena-contenido').innerHTML = ESCENAS[clave];
    $('entorno-titulo').textContent = `Afuera de ${e.enFrase}.`;
    $('entorno-lugar').textContent = clave === propio ? `${e.nombre}, donde está ${a ? a.nombre : 'el astronauta'}` : `${e.nombre}, para comparar`;

    $('entorno-gravedad').textContent = e.gravedad.texto;
    $('entorno-gravedad-barra').style.width = `${Math.max(e.gravedad.g * 100, 1.5)}%`;
    $('entorno-gravedad-nota').textContent = e.gravedad.detalle;

    $('entorno-temp').firstElementChild.textContent = `${Calc.numero(e.temperatura.min, 0).replace('-', '−')} a ${Calc.numero(e.temperatura.max, 0)}`;
    const r = $('entorno-temp-rango');
    r.style.left = `${posT(e.temperatura.min)}%`;
    r.style.width = `${posT(e.temperatura.max) - posT(e.temperatura.min)}%`;
    $('entorno-temp-cabina').style.left = `${posT(e.cabina)}%`;
    $('entorno-temp-nota').textContent = `${e.temperatura.detalle}. Dentro se mantiene cerca de ${e.cabina} °C.`;

    $('entorno-dia').firstElementChild.textContent = e.dia.cifra;
    $('entorno-dia').lastElementChild.textContent = e.dia.unidad;
    $('entorno-dia-nota').textContent = e.dia.detalle;

    $('entorno-musculo').textContent = e.musculo;

    document.querySelectorAll('#entorno-selector button').forEach((b) => {
      b.setAttribute('aria-pressed', String(b.dataset.valor === clave));
      b.textContent = Calc.ENTORNOS[b.dataset.valor].corto + (b.dataset.valor === propio ? ' (actual)' : '');
    });
  }

  function dibujar(a) {
    pintar(a.entorno && Calc.ENTORNOS[a.entorno] ? a.entorno : 'orbita');
    const dias = Math.max(0, Calc.diasDesde(a.fecha_inicio_mision) || 0);
    const el = $('entorno-dias');
    el.textContent = '0';
    // El contador arranca cuando la escena entra en pantalla
    if ('IntersectionObserver' in window && !sinMovimiento) {
      const obs = new IntersectionObserver((ent) => {
        if (ent.some((x) => x.isIntersecting)) { contar(el, dias); obs.disconnect(); }
      }, { threshold: 1 });
      obs.observe(el);   // arranca cuando la cifra de días se ve en pantalla
    } else {
      contar(el, dias);
    }
  }

  $('entorno-selector').addEventListener('cambio', (e) => pintar(e.detail));
  document.addEventListener('astronauta-elegido', (e) => dibujar(e.detail));
  document.addEventListener('astronauta-actualizado', (e) => {
    if (Sesion.astronauta && e.detail.id_astronauta === Sesion.astronauta.id_astronauta) dibujar(e.detail);
  });
})();
</script>
