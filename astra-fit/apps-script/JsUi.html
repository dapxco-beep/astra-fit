<!--
  JsUi.html — Comportamientos visuales compartidos (sin datos).
  Úsalos en vez de reescribirlos:
    UI.aviso('Evaluación guardada.', 'completado')   tipos: estado | completado | advertencia | error
    <div class="segmentado" data-segmentado> ... <button aria-pressed="true">  → alterna solo
    UI.esc(texto)   escapa texto que viene de los datos antes de meterlo en innerHTML
    UI.avatar(astronauta, 'avatar--grande')   círculo con el emoji o la inicial del astronauta
-->
<script>
const UI = (() => {
  /* Aviso flotante (toast). Opciones: { accion: { texto, fn }, duracion: ms, persistente: true }.
     Los errores no se cierran solos: quedan hasta que la persona los cierre. */
  let temporizador;
  function aviso(texto, tipo = 'estado', opciones = {}) {
    let el = document.getElementById('aviso');
    if (!el) { el = document.createElement('div'); el.id = 'aviso'; document.body.appendChild(el); }
    const persistente = opciones.persistente ?? tipo === 'error';
    el.setAttribute('role', tipo === 'error' ? 'alert' : 'status');
    el.setAttribute('aria-live', tipo === 'error' ? 'assertive' : 'polite');
    el.className = `aviso aviso--${tipo}`;
    el.textContent = '';
    const t = document.createElement('span'); t.textContent = texto; el.appendChild(t);
    const cerrar = () => { clearTimeout(temporizador); el.classList.remove('visible'); };
    if (opciones.accion) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = opciones.accion.texto;
      b.addEventListener('click', () => { cerrar(); opciones.accion.fn(); }); el.appendChild(b);
    }
    if (persistente) { const x = document.createElement('button'); x.type = 'button'; x.textContent = 'Cerrar'; x.addEventListener('click', cerrar); el.appendChild(x); }
    requestAnimationFrame(() => el.classList.add('visible'));
    clearTimeout(temporizador);
    if (!persistente) temporizador = setTimeout(() => el.classList.remove('visible'), opciones.duracion || 3200);
  }

  /* Controles segmentados: un clic marca el botón y avisa con el evento "cambio" */
  document.addEventListener('click', (e) => {
    const boton = e.target.closest('[data-segmentado] button');
    if (!boton) return;
    const grupo = boton.closest('[data-segmentado]');
    grupo.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === boton)));
    grupo.dispatchEvent(new CustomEvent('cambio', { detail: boton.dataset.valor ?? boton.textContent.trim() }));
  });
  /* Enlaces internos (#cuerpo, #monitoreo...): Apps Script obliga a usar <base target="_top">, que haría que el
     enlace intente abrir la ventana de afuera. Aquí se intercepta el clic y se baja a la sección dentro de la página. */
  document.addEventListener('click', (e) => {
    const enlace = e.target.closest('a[href^="#"]');
    if (!enlace) return;
    const destino = document.getElementById(enlace.getAttribute('href').slice(1));
    if (!destino) return;
    e.preventDefault();
    const quieto = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const barra = document.querySelector('.nav');
    const arriba = destino.getBoundingClientRect().top + window.scrollY - (barra ? barra.offsetHeight : 0);
    window.scrollTo({ top: destino.id === 'inicio' ? 0 : Math.max(0, arriba), behavior: quieto ? 'auto' : 'smooth' });
  });


  /* Barra superior: marca la sección que se está viendo */
  function seguirSecciones() {
    const enlaces = [...document.querySelectorAll('.nav-enlace[href^="#"]')];
    if (!enlaces.length || !('IntersectionObserver' in window)) return;
    const obs = new IntersectionObserver((entradas) => {
      entradas.forEach((en) => {
        if (!en.isIntersecting) return;
        enlaces.forEach((a) => a.setAttribute('aria-current', String(a.getAttribute('href') === '#' + en.target.id)));
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    enlaces.forEach((a) => { const s = document.querySelector(a.getAttribute('href')); if (s) obs.observe(s); });
  }
  document.addEventListener('DOMContentLoaded', seguirSecciones);

  const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* Avatar de un astronauta: su emoji de astronauta (campo "emoji"). En Mac, iPhone e iPad se ven los de Apple.
     Si no tiene, uno según el sexo: 👩‍🚀 mujer, 👨‍🚀 hombre, 🧑‍🚀 sin dato. */
  const EMOJIS = ['👩‍🚀', '👩🏻‍🚀', '👩🏽‍🚀', '👩🏾‍🚀', '👩🏿‍🚀', '👨‍🚀', '👨🏻‍🚀', '👨🏽‍🚀', '👨🏾‍🚀', '👨🏿‍🚀', '🧑‍🚀', '🧑🏽‍🚀'];
  const emojiDe = (a) => (a && a.emoji && /🚀/u.test(a.emoji)) ? a.emoji : (String(a && a.sexo).toUpperCase() === 'F' ? '👩‍🚀' : String(a && a.sexo).toUpperCase() === 'M' ? '👨‍🚀' : '🧑‍🚀');
  function avatar(a, clase = '') {
    if (!a) return '';
    return `<span class="avatar avatar--emoji ${clase}" aria-hidden="true">${esc(emojiDe(a))}</span>`;
  }

  return { aviso, esc, avatar, EMOJIS, emojiDe };
})();
</script>
