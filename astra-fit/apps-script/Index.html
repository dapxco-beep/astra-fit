  <div class="vista" id="vista-panel" hidden>
    <div class="tablero">
      <!-- Escritorio: barra lateral. Los enlaces los dibuja el selector de vistas (más abajo). -->

      <nav class="barra-lateral" aria-label="Vistas del tablero" id="barra-lateral">

          <a class="nav-marca" href="#inicio"><span class="nav-marca-largo">ASTRA-FIT</span><span class="nav-marca-corto" aria-hidden="true">AF</span></a>
          <button type="button" class="nav-plegar" id="nav-plegar" aria-expanded="true" aria-controls="barra-lateral" aria-label="Ocultar el panel" title="Ocultar el panel">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
          </button>

        <span class="nav-etiqueta"><span class="nav-etiqueta-largo">Datos simulados</span><span class="nav-etiqueta-corto" aria-hidden="true">Sim.</span></span>

            Prototipo de Sinergia Cósmica para NASA Space Apps Challenge 2026, con datos simulados. Las alertas son indicadores de seguimiento, no diagnósticos médicos.
            <span class="nota" id="version-app" data-version="{{VERSION}}"></span>

  <script>
    /* Velocidad: mientras la persona mira la pantalla de entrada, el navegador ya baja en segundo plano las librerías 3D
       y, al pasar el cursor por un astronauta, los modelos que va a necesitar. Así, al elegirlo, casi todo está en caché. */
    (() => {
      const CDN = 'https://cdn.jsdelivr.net/npm/three@0.160.0/';
      const LIBS = ['build/three.module.js', 'examples/jsm/controls/OrbitControls.js', 'examples/jsm/loaders/GLTFLoader.js', 'examples/jsm/libs/meshopt_decoder.module.js',
        'examples/jsm/environments/RoomEnvironment.js', 'examples/jsm/loaders/DRACOLoader.js', 'examples/jsm/postprocessing/EffectComposer.js', 'examples/jsm/postprocessing/RenderPass.js',
        'examples/jsm/postprocessing/UnrealBloomPass.js', 'examples/jsm/postprocessing/OutputPass.js'];
      const calentados = new Set();
      const calentar = (url) => { if (calentados.has(url)) return; calentados.add(url); fetch(url, { mode: 'cors', credentials: 'omit', priority: 'low' }).catch(() => calentados.delete(url)); };
      const idle = window.requestIdleCallback || ((f) => setTimeout(f, 1200));
      // En móvil, con ahorro de datos o conexión lenta no se precarga nada: cada visor baja lo suyo cuando se necesita
      const cn = navigator.connection || {};
      if (cn.saveData || /2g|3g/.test(cn.effectiveType || '') || matchMedia('(max-width: 820px)').matches || (navigator.deviceMemory && navigator.deviceMemory <= 4)) return;
      idle(() => LIBS.forEach((l) => calentar(CDN + l)));
      const base = () => (typeof API !== 'undefined' && API.modo === 'local') ? '/assets/' : 'https://astra-fit-modelos.dapxco.workers.dev/assets/';
      const porSexo = { M: ['anatomy-male-musculos.glb'], F: ['anatomy-female-musculos.glb'] };
      const alPasar = (e) => {
        const t = e.target.closest && e.target.closest('.perfil[data-id]'); if (!t || typeof Sesion === 'undefined' || !Sesion.datos) return;
        const a = Sesion.datos.Astronautas.find((x) => x.id_astronauta === t.dataset.id); if (!a) return;
        ['Xbot-astronauta.glb', ...porSexo[String(a.sexo).toUpperCase() === 'F' ? 'F' : 'M']].forEach((f) => calentar(base() + f));
      };
      document.addEventListener('pointerover', alPasar); document.addEventListener('focusin', alPasar); document.addEventListener('touchstart', alPasar, { passive: true });
    })();
  </script>

  <script>
    /* Barra superior: muestra quién está activo */
    function pintarNav(a) {
      document.getElementById('nav-avatar').innerHTML = UI.avatar(a);
      document.getElementById('nav-nombre').textContent = a.nombre;
      document.getElementById('nav-avatar-m').innerHTML = UI.avatar(a);
      document.getElementById('nav-nombre-m').textContent = a.nombre;
      document.title = a.nombre + ' · ASTRA-FIT';
    }
    document.addEventListener('astronauta-elegido', (e) => pintarNav(e.detail));
    document.addEventListener('astronauta-actualizado', (e) => {
      if (Sesion.astronauta && e.detail.id_astronauta === Sesion.astronauta.id_astronauta) pintarNav(e.detail);
    });
  </script>
  <script>
    /* Tablero: se ve una vista a la vez. Escritorio: barra lateral. Celular: barra inferior con las seis vistas. */
    (() => {
      const I = (d) => '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
      const VISTAS = [
        { id: 'inicio', t: 'Perfil', i: I('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>') },
        { id: 'mision', t: 'Destinos', i: I('<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>') },
        { id: 'monitoreo', t: 'Monitoreo', i: I('<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>') },
        { id: 'alertas', t: 'Alertas', i: I('<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>') },
        { id: 'cuerpo', t: 'Cuerpo', i: I('<circle cx="12" cy="5" r="3"/><path d="M6 21l2-9h8l2 9M9 12l-3-3M15 12l3-3"/>') },
        { id: 'evolucion', t: 'Evolución', i: I('<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>') }
      ];
      // Enlaces viejos que ya no son vistas propias: "Hoy" vive dentro del Perfil y las bandas, dentro del Monitoreo
      const ALIAS = { hoy: 'inicio', sensores: 'monitoreo' };
      // Celular: las seis vistas caben en la barra inferior; "Más" solo aparece si alguna queda por fuera
      const PRINCIPALES = VISTAS.map((v) => v.id);
      const $ = (id) => document.getElementById(id);
      const item = (v, clase) => '<a class="' + clase + '" href="#' + v.id + '" data-vista="' + v.id + '" title="' + v.t + '">' + v.i + '<span>' + v.t + '</span>' + (v.id === 'alertas' ? '<span class="nav-badge" hidden></span>' : '') + '</a>';
      $('nav-lateral').innerHTML = VISTAS.map((v) => '<li>' + item(v, 'nav-item') + '</li>').join('');
      const extras = VISTAS.filter((v) => !PRINCIPALES.includes(v.id));
      $('nav-inferior').innerHTML = VISTAS.filter((v) => PRINCIPALES.includes(v.id)).map((v) => item(v, 'tab')).join('') +
        '<button type="button" class="tab" id="tab-mas" aria-expanded="false" aria-controls="hoja-mas">' + I('<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>') + '<span>Más</span></button>';
      $('tab-mas').hidden = !extras.length;
      $('nav-mas').innerHTML = VISTAS.filter((v) => !PRINCIPALES.includes(v.id)).map((v) => '<li>' + item(v, 'nav-item') + '</li>').join('');

      const ver = $('version-app'); if (ver) ver.textContent = ver.dataset.version && !ver.dataset.version.includes('{{') ? ' Versión ' + ver.dataset.version + '.' : '';
      const hoja = $('hoja-mas'), botonMas = $('tab-mas');
      const cerrarHoja = () => { hoja.hidden = true; botonMas.setAttribute('aria-expanded', 'false'); };
      botonMas.addEventListener('click', () => { hoja.hidden = !hoja.hidden; botonMas.setAttribute('aria-expanded', String(!hoja.hidden)); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !hoja.hidden) { cerrarHoja(); botonMas.focus(); } });
      document.addEventListener('click', (e) => { if (!hoja.hidden && !e.target.closest('#hoja-mas, #tab-mas')) cerrarHoja(); });

      // Equipos modestos: sin animaciones de entrada ni plegado animado
      if ((navigator.hardwareConcurrency || 8) <= 4 || (navigator.deviceMemory || 8) <= 2) document.documentElement.setAttribute('data-ligero', '');
      // Panel lateral plegable (escritorio): se recuerda la elección
      const tablero = document.querySelector('.tablero'), botonPlegar = $('nav-plegar');
      function plegar(p, guardar) {
        tablero.classList.toggle('tablero--plegado', p);
        const t = p ? 'Mostrar el panel' : 'Ocultar el panel';
        botonPlegar.setAttribute('aria-expanded', String(!p)); botonPlegar.setAttribute('aria-label', t); botonPlegar.title = t;
        if (guardar) { try { localStorage.setItem('astrafit-panel-plegado', p ? '1' : '0'); } catch (e) { /* sin almacenamiento: no pasa nada */ } }
      }
      let plegadoAntes = false; try { plegadoAntes = localStorage.getItem('astrafit-panel-plegado') === '1'; } catch (e) { /* idem */ }
      tablero.classList.add('sin-transicion'); plegar(plegadoAntes, false);
      requestAnimationFrame(() => requestAnimationFrame(() => tablero.classList.remove('sin-transicion')));
      botonPlegar.addEventListener('click', () => plegar(!tablero.classList.contains('tablero--plegado'), true));
      // Al terminar la animación, los lienzos y gráficas se vuelven a medir (una sola vez)
      tablero.addEventListener('transitionend', (e) => { if (e.target === tablero && e.propertyName === 'grid-template-columns') window.dispatchEvent(new Event('resize')); });
      // Celular: las barras se esconden al bajar y vuelven al subir, al enfocar algo o al llegar al final; el teclado esconde la barra inferior
      if (window.visualViewport) window.visualViewport.addEventListener('resize', () => document.body.classList.toggle('teclado', window.visualViewport.height < window.innerHeight * 0.75));
      let ultimoY = window.scrollY, esperando = false;
      const evaluarBarras = () => {
        esperando = false;
        const y = window.scrollY, d = y - ultimoY, alFinal = window.innerHeight + y >= document.documentElement.scrollHeight - 8;
        if (y < 60 || alFinal) document.body.classList.remove('barras-ocultas');
        else if (d > 8) document.body.classList.add('barras-ocultas');
        else if (d < -8) document.body.classList.remove('barras-ocultas');
        if (Math.abs(d) > 8) ultimoY = y;
      };
      window.addEventListener('scroll', () => { if (!esperando) { esperando = true; requestAnimationFrame(evaluarBarras); } }, { passive: true });
      document.addEventListener('focusin', (e) => { if (e.target.closest('.barra-superior, .barra-inferior, input, select, textarea')) document.body.classList.remove('barras-ocultas'); });
      let primera = true;
      // "Siguiente" al pie de cada vista: el recorrido es Perfil, Destinos, Monitoreo, Alertas, Cuerpo, Evolución
      function actualizarSiguiente(id) {
        const caja = $('siguiente-vista'); if (!caja) return;
        const i = VISTAS.findIndex((v) => v.id === id), sig = VISTAS[i + 1];
        caja.innerHTML = '<p class="nota">Paso ' + (i + 1) + ' de ' + VISTAS.length + '</p>' + (sig
          ? '<a class="boton" href="#' + sig.id + '">Siguiente: ' + sig.t + ' ›</a>'
          : '<a class="boton boton--secundario" href="#' + VISTAS[0].id + '">Volver al perfil</a>');
      }
      function ir(id) {
        document.body.classList.remove('barras-ocultas');
        if (ALIAS[id]) id = ALIAS[id];
        if (!VISTAS.some((v) => v.id === id)) id = 'inicio';
        const elDe = (x) => $(x === 'inicio' ? 'inicio-vista' : x);
        VISTAS.forEach((v) => { const el = elDe(v.id); if (el) el.hidden = v.id !== id; });
        document.querySelectorAll('[data-vista]').forEach((a) => { if (a.dataset.vista === id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
        botonMas.toggleAttribute('data-activa', !PRINCIPALES.includes(id));
        cerrarHoja();
        window.scrollTo(0, 0);
        // Entrada suave de la vista nueva (solo opacidad en la vista; las tarjetas suben escalonadas). No se repite en los redibujados.
        const nueva = elDe(id);
        if (nueva && !primera && !document.documentElement.hasAttribute('data-ligero')) {
          nueva.classList.remove('vista-entra'); void nueva.offsetWidth; nueva.classList.add('vista-entra');
          clearTimeout(nueva._entra); nueva._entra = setTimeout(() => nueva.classList.remove('vista-entra'), 900);
        }
        // Los lienzos y visores miden su tamaño al mostrarse
        requestAnimationFrame(() => window.dispatchEvent(new Event('resize')));
        // Cada vista tiene un título de nivel 1: las que solo traen h2 reciben uno visible solo para lectores de pantalla
        const vista = elDe(id);
        if (vista && !vista.querySelector('h1')) { const h1 = document.createElement('h1'); h1.className = 'solo-lector'; h1.textContent = VISTAS.find((x) => x.id === id).t; vista.prepend(h1); }
        if (!primera) { const t = elDe(id).querySelector('h2, h1'); if (t) { t.setAttribute('tabindex', '-1'); t.focus({ preventScroll: true }); } }
        actualizarSiguiente(id);
        primera = false;
      }
      // Los enlaces #vista cambian de vista sin depender del hash (en Apps Script la página va dentro de un iframe)
      document.addEventListener('click', (e) => {
        const a = e.target.closest('a[href^="#"]'); if (!a) return;
        if (a.classList.contains('saltar')) { e.preventDefault(); $('contenido').focus({ preventScroll: true }); return; }
        const id = a.getAttribute('href').slice(1); if (!VISTAS.some((v) => v.id === id) && !ALIAS[id]) return;
        if (a.getAttribute('aria-current') === 'page') { e.preventDefault(); window.scrollTo({ top: 0, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); return; }
        e.preventDefault(); ir(id);
        try { history.replaceState(null, '', '#' + id); } catch (err) { /* iframe sin permiso: no pasa nada */ }
      });
      const desdeHash = () => ir((location.hash || '#inicio').slice(1));
      window.addEventListener('hashchange', desdeHash);
      document.addEventListener('astronauta-elegido', () => {
        primera = true; desdeHash(); contarAlertas();
        // El botón pulsado desaparece: el foco pasa al título de la vista (antes se perdía)
        const h = document.querySelector('#contenido > :not([hidden]) h2, #contenido > :not([hidden]) h1');
        if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
      });
      desdeHash();

      // Número de alertas abiertas junto a "Alertas"
      function contarAlertas() {
        if (!Sesion.astronauta || !Sesion.datos) return;
        const n = (Sesion.datos.Alertas || []).filter((x) => x.id_astronauta === Sesion.astronauta.id_astronauta && x.estado !== 'atendida').length;
        document.querySelectorAll('.nav-badge').forEach((b) => { b.textContent = String(n); b.hidden = !n; b.setAttribute('aria-label', n + (n === 1 ? ' alerta abierta' : ' alertas abiertas')); });
      }
      document.addEventListener('datos-actualizados', contarAlertas);
    })();
  </script>
