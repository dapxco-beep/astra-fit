<!-- SeccionHoy.html — "Estado de hoy", dentro del Perfil (SeccionInicio lo incluye debajo del encabezado).  Fondo: gris.
     Antes era una vista propia ("Hoy"); ahora el Perfil es la primera vista del panel y resume cómo está el astronauta:
     riesgo ERDM-A global y de cada uno de los 6 músculos, alertas abiertas y qué hacer, y el plan de fortalecimiento
     del músculo más comprometido. Los datos personales, el IMC y los signos vitales siguen debajo, en SeccionInicio.
     Usa Erdm (JsErdm.html) y Calc (JsCalculos.html). Escucha "astronauta-elegido", "astronauta-actualizado" y "datos-actualizados".
     Las alertas son indicadores de seguimiento, no diagnósticos médicos. -->
<section class="seccion seccion--gris seccion--compacta hoy" id="hoy-estado" aria-labelledby="hoy-titulo">
  <div class="contenedor pila-grande">
    <div class="hoy-cabecera">
      <div class="pila">
        <p class="nota" id="hoy-fecha"></p>
        <h2 class="titulo-tarjeta hoy-titulo" id="hoy-titulo">Estado de hoy</h2>
        <p class="texto-2" id="hoy-sub"></p>
      </div>
    </div>

    <div class="hoy-kpis" id="hoy-kpis" aria-live="polite"></div>

    <div class="hoy-rejilla">
      <article class="tarjeta pila" aria-labelledby="hoy-t-musculos">
        <div class="tarjeta-cabecera"><h3 class="titulo-tarjeta" id="hoy-t-musculos">Los seis músculos</h3><a class="enlace" href="#monitoreo">Ver el monitoreo</a></div>
        <div class="hoy-musculos" id="hoy-musculos"></div>
        <p class="nota">Puntaje ERDM-A de 0 a 10 frente a la evaluación basal del astronauta. 0 a 3 bajo, 4 a 6 moderado, 7 a 10 alto.</p>
      </article>

      <article class="tarjeta pila" aria-labelledby="hoy-t-hacer">
        <div class="tarjeta-cabecera"><h3 class="titulo-tarjeta" id="hoy-t-hacer">Qué hacer hoy</h3><a class="enlace" href="#alertas">Ver alertas</a></div>
        <div class="pila" id="hoy-hacer"></div>
      </article>
    </div>
  </div>
</section>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const ORDEN = { bajo: 0, moderado: 1, alto: 2 };
  const TEXTO = { bajo: 'Riesgo bajo', moderado: 'Riesgo moderado', alto: 'Riesgo alto' };
  const ORDEN_NIVEL = { rojo: 0, amarillo: 1 };

  function musculos(a) {
    return Erdm.GRUPOS.map((g) => ({ g, u: Erdm.ultima(a.id_astronauta, g) }));
  }
  function peor(lista) {
    return lista.filter((x) => x.u).sort((p, q) => (ORDEN[q.u.riesgo] - ORDEN[p.u.riesgo]) || (q.u.puntaje_erdm - p.u.puntaje_erdm))[0] || null;
  }
  const abiertas = (a) => (Sesion.datos.Alertas || []).filter((x) => x.id_astronauta === a.id_astronauta && x.estado !== 'atendida')
    .sort((p, q) => (ORDEN_NIVEL[p.nivel] - ORDEN_NIVEL[q.nivel]) || String(q.creada_en).localeCompare(String(p.creada_en)));

  function kpi(titulo, cifra, detalle, nivel) {
    return `<article class="tarjeta pila hoy-kpi"${nivel ? ` data-nivel="${nivel}"` : ''}><p class="nota">${titulo}</p><p class="cifra hoy-cifra">${cifra}</p><p class="texto-2">${detalle}</p></article>`;
  }

  function dibujar() {
    const a = Sesion.astronauta; if (!a || !Sesion.datos) return;
    const lista = musculos(a), p = peor(lista), alertas = abiertas(a);
    const rojas = alertas.filter((x) => x.nivel === 'rojo').length;
    const hoy = new Date().toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' });
    $('hoy-fecha').textContent = hoy.charAt(0).toUpperCase() + hoy.slice(1);
    $('hoy-sub').textContent = p
      ? (p.u.riesgo === 'bajo' ? 'Los seis músculos están dentro de lo esperado.' : `Lo que más pide atención hoy: ${Erdm.etiqueta(p.g).toLowerCase()}.`)
      : 'Todavía no hay evaluaciones. Empieza por la evaluación basal en el monitoreo.';

    const fechas = lista.filter((x) => x.u).map((x) => String(x.u.fecha)).sort();
    const enRiesgo = lista.filter((x) => x.u && x.u.riesgo !== 'bajo').length;   // el día de misión ya está en el encabezado
    $('hoy-kpis').innerHTML =
      kpi('Riesgo muscular', p ? p.u.riesgo.charAt(0).toUpperCase() + p.u.riesgo.slice(1) : '—', p ? `${p.u.puntaje_erdm} de 10 en ${Erdm.etiqueta(p.g).toLowerCase()}` : 'Sin evaluar', p ? Erdm.nivel(p.u.riesgo) : '') +
      kpi('Alertas abiertas', String(alertas.length), rojas ? `${rojas} ${rojas === 1 ? 'requiere' : 'requieren'} valoración del médico de vuelo` : alertas.length ? 'Para vigilar o repetir la medición' : 'Todo en orden', rojas ? 'rojo' : alertas.length ? 'amarillo' : 'verde') +
      kpi('Última evaluación', fechas.length ? Calc.relativo(fechas[fechas.length - 1]).replace('Hace ', 'Hace ').toLowerCase().replace(/^./, (x) => x.toUpperCase()) : '—', fechas.length ? Calc.fechaCorta(fechas[fechas.length - 1]) : 'Sin registros', '') +
      kpi('Músculos en riesgo', `${enRiesgo}<small> de 6</small>`, enRiesgo ? 'Con riesgo moderado o alto en la ERDM-A' : 'Los seis en riesgo bajo', enRiesgo ? 'amarillo' : (lista.some((x) => x.u) ? 'verde' : ''));

    $('hoy-musculos').innerHTML = lista.map(({ g, u }) => {
      if (!u) return `<a class="hoy-musculo" href="#monitoreo"><strong>${UI.esc(Erdm.etiqueta(g))}</strong><span class="estado estado--gris">Sin evaluar</span></a>`;
      const n = Erdm.nivel(u.riesgo);
      return `<a class="hoy-musculo" href="#monitoreo" data-nivel="${n}"><strong>${UI.esc(Erdm.etiqueta(g))}</strong>
        <span class="hoy-puntaje">${u.puntaje_erdm}<small>/10</small></span>
        <span class="estado estado--${n}">${TEXTO[u.riesgo]}</span>
        ${u.alerta_prioritaria === 'SI' ? '<span class="estado estado--rojo">Evaluación prioritaria</span>' : ''}</a>`;
    }).join('');

    const top = alertas.slice(0, 3);
    let html = top.map((x) => `<div class="hoy-alerta" data-nivel="${UI.esc(x.nivel)}"><span class="estado estado--${x.nivel === 'rojo' ? 'rojo' : 'amarillo'}">${x.nivel === 'rojo' ? 'Alerta' : 'Precaución'}</span>
      <p class="texto">${UI.esc(x.mensaje)}</p>${x.recomendacion ? `<p class="pequeno texto-2">${UI.esc(x.recomendacion)}</p>` : ''}</div>`).join('');
    if (alertas.length > top.length) html += `<a class="enlace" href="#alertas">Ver las ${alertas.length - top.length} alertas restantes</a>`;
    if (!alertas.length) html = '<p class="texto-2">No hay alertas abiertas. Mantén tu programa de ejercicio y repite las mediciones en las fechas previstas.</p>';
    const pl = p && p.u.riesgo !== 'bajo' ? Erdm.plan(p.g, p.u.riesgo) : null;
    if (pl) html += `<div class="hoy-plan"><p class="nota">Plan para ${UI.esc(Erdm.etiqueta(p.g).toLowerCase())}</p><p class="texto"><strong>${UI.esc(pl.ejercicio)}</strong></p><p class="pequeno texto-2">${UI.esc(pl.dosificacion)}</p></div>`;
    $('hoy-hacer').innerHTML = html;
  }
  document.addEventListener('astronauta-elegido', dibujar);
  document.addEventListener('astronauta-actualizado', dibujar);
  document.addEventListener('datos-actualizados', dibujar);
})();
</script>
