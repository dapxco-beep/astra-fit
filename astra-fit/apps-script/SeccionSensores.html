<!-- SeccionSensores.html — Guía de la banda (ventana emergente).  Va dentro del Monitoreo.
     Antes era la vista "Bandas"; ahora no es una vista propia: al tocar uno de los 6 músculos en la figura del Monitoreo se
     abre esta ventana con lo que mide su banda y una animación de dónde y cómo ponerla para que la medición se parezca lo
     más posible a la realidad.

     Puntos de colocación: recomendaciones europeas SENIAM para EMG de superficie (Hermens y cols., 2000; seniam.org).
     SENIAM no describe los flexores del antebrazo: para ellos se usa el vientre del músculo, en el tercio proximal.
     SIMULADO: no hay hardware. El estado y la batería de cada banda salen del escenario del astronauta (siempre los mismos).
     Uso:  GuiaBanda.abrir('cuadriceps')     Necesita window.FiguraMon (SeccionMonitoreo) para dibujar la anatomía. -->
<dialog class="dialogo guia" id="guia-banda" aria-labelledby="guia-titulo">
  <div class="guia-hoja">
    <div class="guia-cabecera">
      <div class="guia-titulos">
        <p class="nota" id="guia-banda-n"></p>
        <h2 class="titulo-tarjeta" id="guia-titulo">Cómo ponerse la banda</h2>
        <div class="guia-estado" id="guia-estado"></div>
      </div>
      <button type="button" class="guia-cerrar" data-cerrar aria-label="Cerrar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="guia-cuerpo">
      <figure class="guia-figura">
        <svg id="guia-svg" viewBox="0 0 290 348" role="img" aria-labelledby="guia-svg-desc"><desc id="guia-svg-desc">Animación de la colocación de la banda</desc></svg>
        <figcaption class="guia-leyenda" id="guia-leyenda" aria-live="polite"></figcaption>
        <div class="guia-controles">
          <button type="button" class="enlace enlace--simple pequeno" id="guia-pausa">Pausar</button>
          <span class="nota" id="guia-escala"></span>
        </div>
      </figure>

      <div class="pila">
        <p class="pequeno texto-2" id="guia-postura"></p>
        <ol class="guia-pasos" id="guia-pasos"></ol>
      </div>
    </div>

    <div class="guia-funciona">
      <h3 class="titulo-tarjeta guia-subtitulo">Variables registradas</h3>
      <div class="guia-mide" id="guia-mide"></div>
    </div>

    <div class="guia-pie">
      <p class="nota">Colocación según las recomendaciones SENIAM para EMG de superficie. Datos simulados.</p>
      <button type="button" class="boton" id="guia-medir">Ver señales y medir</button>
    </div>
  </div>
</dialog>


<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (t) => UI.esc(t);
  const NS = 'http://www.w3.org/2000/svg';

  /* ======================================================== LAS SEIS BANDAS
     punto: dónde van los electrodos (SENIAM). postura: cómo se pone el astronauta. ref: electrodo de referencia (sobre hueso).
     segmento: dónde queda la IMU. fibras: dirección de las fibras, que es la dirección del par de electrodos (grados desde
     la vertical de la imagen). La IMU mide el movimiento de ese segmento durante la tarea. */
  const GUIA = {
    soleo: {
      n: 1, segmento: 'Pierna, cara medial distal', fibras: 0,
      postura: 'Sedente, rodilla en flexión de 90° y pie apoyado.',
      punto: 'A dos tercios de la línea entre el cóndilo medial del fémur y el maléolo medial, distal al vientre del gastrocnemio.',
      ref: 'maléolo medial o cara medial de la tibia',
      imu: 'la pierna durante la flexión plantar: ritmo y regularidad de cada elevación'
    },
    gastrocnemio: {
      n: 2, segmento: 'Pierna, cara posterior', fibras: 0,
      postura: 'Decúbito prono o bipedestación, rodilla en extensión.',
      punto: 'Sobre la zona más prominente del vientre del gastrocnemio medial, en el eje longitudinal de la pierna.',
      ref: 'maléolo o tibia',
      imu: 'la pierna: amplitud y regularidad de la elevación del talón en cada repetición'
    },
    cuadriceps: {
      n: 3, segmento: 'Muslo, cara anterior', fibras: 4,
      postura: 'Sedente, tronco erguido y rodilla en ligera flexión.',
      punto: 'En el punto medio de la línea entre la espina ilíaca anterosuperior y el borde superior de la rótula, sobre el recto femoral.',
      ref: 'rótula o maléolo',
      imu: 'el muslo: velocidad y rango de la extensión de rodilla, y regularidad entre repeticiones'
    },
    biceps_braquial: {
      n: 4, segmento: 'Brazo, cara anterior', fibras: 6,
      postura: 'Sedente, codo en flexión de 90° y antebrazo en supinación.',
      punto: 'Sobre la línea entre el acromion y la fosa cubital, a un tercio de la distancia desde la fosa cubital.',
      ref: 'muñeca (apófisis estiloides del cúbito)',
      imu: 'el brazo: rotación del segmento en cada flexión de codo y duración de cada repetición'
    },
    triceps_braquial: {
      n: 5, segmento: 'Brazo, cara posterior', fibras: -4,
      postura: 'Sedente, brazo junto al tronco y codo en flexión de 90°.',
      punto: 'En el punto medio de la línea entre la cresta posterior del acromion y el olécranon, dos traveses de dedo hacia medial, sobre la cabeza larga.',
      ref: 'muñeca (apófisis estiloides del cúbito)',
      imu: 'el brazo: velocidad de la extensión de codo y regularidad entre repeticiones'
    },
    flexores_antebrazo: {
      n: 6, segmento: 'Antebrazo, cara anterior proximal', fibras: 12,
      postura: 'Sedente, antebrazo apoyado en supinación.',
      punto: 'Tercio proximal de la cara anterior del antebrazo, unos cuatro traveses de dedo distal al pliegue del codo, sobre el vientre muscular que se contrae con la prensión.',
      ref: 'apófisis estiloides del cúbito',
      imu: 'el antebrazo: movimiento de la muñeca durante la prensión y regularidad entre repeticiones'
    }
  };

  const ESTADOS = {
    activa: { texto: 'Adquisición activa', clase: 'verde' },
    conectada: { texto: 'Conectado', clase: 'verde' },
    senal: { texto: 'Señal de calidad insuficiente', clase: 'amarillo' },
    bateria: { texto: 'Batería baja', clase: 'amarillo' },
    desconectada: { texto: 'Desconectado', clase: 'rojo' }
  };
  function azar(texto) { let h = 2166136261; for (const c of texto) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } let t = h >>> 0;
    return () => { t = Math.imul(t ^ (t >>> 15), t | 1) + 0x6D2B79F5 | 0; t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  /** Estado simulado de cada banda según el escenario del astronauta (siempre el mismo para el mismo astronauta). */
  function estadoBanda(a, grupo) {
    const r = azar('bandas' + a.id_astronauta);
    const porN = {};
    for (let n = 1; n <= 6; n++) {
      let bateria = Math.round(55 + r() * 40), estado = 'activa';
      if (a.escenario === 'perdida_fuerza' && n === 1) { bateria = 14; estado = 'bateria'; }
      if (a.escenario === 'asimetria' && (n === 5 || n === 6)) estado = 'senal';
      porN[n] = { bateria, estado };
    }
    return porN[GUIA[grupo].n];
  }

  /* ======================================================== LOS PASOS
     El paso 2 cambia con el músculo. La animación muestra cada paso sobre la anatomía, acercada al músculo. */
  const PASOS = (gu) => [
    { t: 'Preparar la piel', d: 'Rasurar si hay vello, abrasión suave y limpieza con alcohol; dejar secar. Así baja la impedancia piel-electrodo y el ruido de la señal.' },
    { t: 'Ubicar el punto', d: gu.punto },
    { t: 'Colocar los electrodos', d: 'Electrodos de 10 mm de diámetro como máximo, a 20 mm entre centros y alineados con las fibras. Referencia: ' + gu.ref + '.' },
    { t: 'Ajustar la banda', d: 'Banda sobre los electrodos, firme sin comprimir; no debe desplazarse ni rotar durante la tarea. Módulo de la IMU en la cara externa.' },
    { t: 'Conectar y calibrar', d: 'Reposo de unos 5 s mientras se calibra la IMU y se verifica la calidad de la señal. Indicador en verde: banda lista.' }
  ];
  const LEYENDA = ['Preparación de la piel', 'Punto de colocación', 'Electrodos a 20 mm', 'Banda colocada', 'Calibración'];
  const DURACION = 3200;   // ms por paso

  let grupoActual = null, paso = 0, temporizador = null, pausado = false;
  const quieto = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const el = (tag, attrs = {}) => { const n = document.createElementNS(NS, tag); Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v)); return n; };

  /** Dibuja la anatomía acercada al músculo, con los electrodos, la banda y la IMU listos para animar. */
  function dibujar(grupo) {
    const svg = $('guia-svg'), F = window.FiguraMon;
    svg.querySelectorAll(':scope > :not(desc)').forEach((n) => n.remove());
    if (!F) return;
    const m = F.MUSCULOS[grupo], sx = F.FIGURA || 'M', p = sx.toLowerCase();
    const b = F.BANDAS[sx][m.mascara];
    // Coordenadas de la imagen (640 × 1000). Ventana de 290 × 348 centrada en la banda: se ve el músculo y su segmento.
    const cx = (b.x0 + b.x1) / 2 * 640, cy = b.y * 1000, ancho = (b.x1 - b.x0) * 640;
    const VW = 290, VH = 348;
    svg.setAttribute('viewBox', `${(cx - VW / 2).toFixed(1)} ${(cy - VH / 2).toFixed(1)} ${VW} ${VH}`);
    const href = (n) => `${F.BASE_IMG}${p}-${F.ARCHIVO_VISTA[m.vista]}-${n}.png`;
    const defs = el('defs');
    const mask = el('mask', { id: 'guia-mascara', maskUnits: 'userSpaceOnUse', x: 0, y: 0, width: 640, height: 1000 });
    const mi = el('image', { x: 0, y: 0, width: 640, height: 1000 }); mi.setAttribute('href', href(m.mascara)); mask.appendChild(mi); defs.appendChild(mask);
    svg.appendChild(defs);
    svg.appendChild(el('rect', { x: cx - VW, y: cy - VH, width: VW * 2, height: VH * 2, class: 'guia-fondo' }));
    const base = el('image', { x: 0, y: 0, width: 640, height: 1000, class: 'guia-base' }); base.setAttribute('href', href('base')); svg.appendChild(base);
    svg.appendChild(el('rect', { x: 0, y: 0, width: 640, height: 1000, mask: 'url(#guia-mascara)', class: 'guia-musculo', fill: F.COLOR_RIESGO[F.nivel(grupo)] || F.COLOR_RIESGO.gris }));

    // Todo lo de la banda gira con las fibras del músculo
    const g = el('g', { transform: `rotate(${GUIA[grupo].fibras} ${cx} ${cy})` });
    // 1. piel: un círculo que "limpia"
    g.appendChild(el('circle', { cx, cy, r: 24, class: 'guia-piel' }));
    // 2. punto: línea de referencia en la dirección de las fibras y cruz
    g.appendChild(el('line', { x1: cx, y1: cy - 70, x2: cx, y2: cy + 70, class: 'guia-linea' }));
    g.appendChild(el('path', { d: `M${cx - 6} ${cy}h12M${cx} ${cy - 6}v12`, class: 'guia-cruz' }));
    // 3. electrodos: 1 px de la imagen ≈ 1,9 mm → 20 mm entre centros ≈ 10,5 px; 10 mm ≈ 5 px de diámetro
    [-5.25, 5.25].forEach((d) => g.appendChild(el('circle', { cx, cy: cy + d, r: 3.2, class: 'guia-electrodo' })));
    // 4. banda (entra desde un lado) con el módulo de la IMU y su luz
    const lado = m.lado < 0 ? -1 : 1;
    const banda = el('g', { class: 'guia-banda', style: `--desde:${lado * -70}px` });
    const largo = ancho + 24;
    banda.appendChild(el('rect', { x: cx - largo / 2, y: cy - 11, width: largo, height: 22, rx: 7, class: 'guia-tela' }));
    const mx = lado < 0 ? cx - largo / 2 - 13 : cx + largo / 2 - 3;
    banda.appendChild(el('rect', { x: mx, y: cy - 9, width: 16, height: 18, rx: 4, class: 'guia-modulo' }));
    banda.appendChild(el('circle', { cx: mx + 8, cy: cy - 3, r: 2.4, class: 'guia-luz' }));
    banda.appendChild(el('circle', { cx: mx + 8, cy: cy - 3, r: 2.4, class: 'guia-luz-pulso' }));
    g.appendChild(banda);
    // Los electrodos se siguen viendo a través de la banda
    [-5.25, 5.25].forEach((d) => g.appendChild(el('circle', { cx, cy: cy + d, r: 3.2, class: 'guia-electrodo guia-electrodo--encima' })));
    svg.appendChild(g);
    $('guia-escala').textContent = 'Vista acercada. Electrodos a escala aproximada.';
  }

  function irA(n) {
    paso = (n + 5) % 5;
    $('guia-svg').dataset.paso = String(paso + 1);
    $('guia-leyenda').textContent = `${paso + 1}. ${LEYENDA[paso]}`;
    document.querySelectorAll('#guia-pasos li').forEach((li, i) => { li.classList.toggle('es-hecho', i < paso); if (i === paso) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current'); });
  }
  function programar() {
    clearInterval(temporizador); temporizador = null;
    if (pausado || quieto()) return;
    temporizador = setInterval(() => irA(paso + 1), DURACION);
  }

  function abrir(grupo) {
    const a = Sesion.astronauta; if (!a || !GUIA[grupo]) return;
    grupoActual = grupo;
    const gu = GUIA[grupo], est = estadoBanda(a, grupo), e = ESTADOS[est.estado];
    const tarea = ((Sesion.datos.Catalogos || []).find((c) => c.lista === 'tarea' && c.musculos === grupo) || {}).etiqueta || 'contracción estandarizada';
    $('guia-banda-n').textContent = `Banda ${gu.n} de 6 · ${gu.segmento}`;
    $('guia-titulo').textContent = Erdm.etiqueta(grupo);
    $('guia-estado').innerHTML = `<span class="estado estado--${e.clase}">${e.texto}</span><span class="nota">Batería ${est.bateria} %</span>`;
    $('guia-postura').innerHTML = `<strong>Postura:</strong> ${esc(gu.postura)}`;
    $('guia-pasos').innerHTML = PASOS(gu).map((x, i) => `<li><button type="button" data-paso="${i}"><span class="guia-num" aria-hidden="true">${i + 1}</span><span><strong>${esc(x.t)}</strong><span class="pequeno texto-2">${esc(x.d)}</span></span></button></li>`).join('');
    $('guia-mide').innerHTML = [
      ['EMG', '2.000 Hz', `Actividad eléctrica del ${esc(Erdm.etiqueta(grupo).toLowerCase())} durante la tarea estandarizada (${esc(tarea.toLowerCase())}). Se calculan RMS y frecuencia mediana para la dimensión EMG.`],
      ['IMU', '100 Hz', `Acelerómetro y giroscopio sobre ${esc(gu.imu)}. La variación entre repeticiones (CV) define la dimensión de coordinación.`],
      ['Fuerza', 'Dinamómetro', 'Fuerza en la misma tarea, comparada con la basal para la dimensión de fuerza.']
    ].map(([t, f, d]) => `<div class="guia-mide-item"><p><strong>${t}</strong> <span class="nota">${f}</span></p><p class="pequeno texto-2">${d}</p></div>`).join('');
    dibujar(grupo);
    pausado = false; $('guia-pausa').textContent = 'Pausar'; $('guia-pausa').hidden = quieto();
    irA(quieto() ? 4 : 0);
    if (!$('guia-banda').open) $('guia-banda').showModal();
    programar();
  }
  function cerrar() { clearInterval(temporizador); temporizador = null; if ($('guia-banda').open) $('guia-banda').close(); }

  $('guia-banda').addEventListener('click', (e) => { if (e.target === $('guia-banda') || e.target.closest('[data-cerrar]')) cerrar(); });
  $('guia-banda').addEventListener('close', () => { clearInterval(temporizador); temporizador = null; });
  $('guia-pasos').addEventListener('click', (e) => { const b = e.target.closest('[data-paso]'); if (!b) return; irA(Number(b.dataset.paso)); programar(); });
  $('guia-pausa').addEventListener('click', () => { pausado = !pausado; $('guia-pausa').textContent = pausado ? 'Reanudar' : 'Pausar'; programar(); });
  $('guia-medir').addEventListener('click', () => { const g = grupoActual; cerrar(); if (window.Monitoreo) window.Monitoreo.elegir(g); });

  window.GuiaBanda = { abrir, cerrar, GUIA };
})();
</script>
