<!-- SeccionEvolucion.html — Evolución semana a semana.  Fondo: gris.  Responsable: Dashboard
     Seguimiento longitudinal (documento ASTRA-FIT, Módulo 4): una gráfica por músculo (los 6 de la ERDM-A) con el
     puntaje o el cambio de una dimensión frente a la basal, por semana de misión. Las líneas punteadas son los cortes
     de moderado y alto de la pestaña EscalaERDM; el color de cada punto es su nivel (con texto en el tooltip).
     Datos: pestaña Evaluaciones (calculada con JsErdm). Escucha "astronauta-elegido" y "datos-actualizados". -->
<section class="seccion seccion--gris" id="evolucion">
  <div class="contenedor contenedor--ancho">
    <div class="seccion-cabecera">
      <h2 class="titulo">Evolución semanal</h2>
    </div>

    <div class="evo-controles">
      <div class="segmentado" data-segmentado id="evo-medida" role="group" aria-label="Qué mostrar">
        <button type="button" data-valor="puntaje" aria-pressed="true">Puntaje ERDM-A</button>
        <button type="button" data-valor="fuerza" aria-pressed="false">Fuerza</button>
        <button type="button" data-valor="coordinacion" aria-pressed="false">Coordinación</button>
        <button type="button" data-valor="circunferencia" aria-pressed="false">Circunferencia</button>
        <button type="button" data-valor="emg" aria-pressed="false">EMG</button>
        <button type="button" data-valor="vo2pico" aria-pressed="false">VO₂pico</button>
      </div>
      <p class="pequeno texto-2" id="evo-explica"></p>
    </div>

    <div class="evo-rejilla" id="evo-rejilla"></div>
    <div class="evo-tooltip" id="evo-tooltip" role="status" hidden></div>

    <details class="evo-tabla-bloque">
      <summary class="enlace enlace--simple">Ver los datos en tabla</summary>
      <div class="tabla-envoltura" tabindex="0" role="region" aria-label="Datos de evolución en tabla"><table class="mon-tabla evo-tabla" id="evo-tabla"></table></div>
    </details>
  </div>
</section>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (t) => UI.esc(t);
  const n0 = (v, d = 0) => Number(v).toLocaleString('es', { minimumFractionDigits: d, maximumFractionDigits: d });

  const MEDIDAS = {
    puntaje: { eje: 'Puntaje ERDM-A (0–10)', valor: (f) => num(f.puntaje_erdm), texto: (v) => `${v} de 10`, explica: 'Suma de las cinco dimensiones de la escala: bajo 0–3, moderado 4–6, alto 7–10.' },
    fuerza: { eje: 'Pérdida de fuerza (%)', campo: 'cambio_fuerza_pct', puntos: 'p_fuerza', corte: 'fuerza', texto: (v) => `${v < 0 ? 'ganó' : 'perdió'} ${n0(Math.abs(v), 1)} %`, explica: 'Dinamometría frente a la basal. Cualquier pérdida suma 1 punto; más de 10 % suma 2. Más de 20 % es evaluación prioritaria.' },
    coordinacion: { eje: 'Aumento de la variabilidad (%)', campo: 'cambio_coordinacion_pct', puntos: 'p_coordinacion', corte: 'coordinacion', texto: (v) => `${v < 0 ? 'bajó' : 'subió'} ${n0(Math.abs(v), 1)} %`, explica: 'Coeficiente de variación entre repeticiones, medido con la IMU. Más variabilidad es menos control del movimiento.' },
    circunferencia: { eje: 'Pérdida de circunferencia (%)', campo: 'cambio_circunferencia_pct', puntos: 'p_circunferencia', corte: 'circunferencia', texto: (v) => `${v < 0 ? 'ganó' : 'perdió'} ${n0(Math.abs(v), 1)} %`, explica: 'Cinta métrica en el mismo punto anatómico. Más de 15 % es evaluación prioritaria.' },
    emg: { eje: 'Cambio de EMG (%)', campo: 'cambio_emg_pct', puntos: 'p_emg', corte: 'emg', texto: (v) => `cambió ${n0(Math.abs(v), 1)} %`, explica: 'Mayor cambio, en valor absoluto, entre el RMS y la frecuencia mediana frente a la basal.' },
    vo2pico: { eje: 'Pérdida de VO₂pico (%)', campo: 'cambio_vo2_pct', puntos: 'p_vo2', corte: 'vo2pico', texto: (v) => `${v < 0 ? 'ganó' : 'perdió'} ${n0(Math.abs(v), 1)} %`, explica: 'Indicador sistémico: el mismo valor cuenta para los 6 músculos.' }
  };
  const num = (v) => (v === null || v === undefined || v === '' || isNaN(Number(v)) ? null : Number(v));
  let medida = 'puntaje';
  const NIVEL_PUNTOS = ['verde', 'amarillo', 'rojo'];
  const TEXTO_NIVEL = { verde: 'riesgo bajo', amarillo: 'moderado', rojo: 'alto' };

  /** Serie de un músculo: [{ semana, fecha, valor, nivel, fila }] desde su basal. */
  function serie(g) {
    const a = Sesion.astronauta, m = MEDIDAS[medida];
    const b = Erdm.basal(a.id_astronauta, g); if (!b) return { b: null, pts: [] };
    const pts = Erdm.historial(a.id_astronauta, g).map((f) => {
      const valor = f.fase === 'basal' ? 0 : (m.valor ? m.valor(f) : num(f[m.campo]));
      if (valor === null) return null;
      const p = medida === 'puntaje' ? null : num(f[m.puntos]);
      const nivel = medida === 'puntaje' ? Erdm.nivel(f.fase === 'basal' ? 'bajo' : f.riesgo) : NIVEL_PUNTOS[p || 0];
      return { semana: (Date.parse(f.fecha) - Date.parse(b.fecha)) / (7 * 864e5), fecha: f.fecha, valor, nivel, fila: f };
    }).filter(Boolean);
    return { b, pts };
  }

  function cortes() {
    const m = MEDIDAS[medida];
    const c = Erdm.corte(medida === 'puntaje' ? 'total' : m.corte);
    return { moderado: c.moderado, alto: c.alto };
  }

  const W = 380, H = 200, IZ = 40, DE = 64, AR = 12, AB = 26;
  function grafica(g, s, escala) {
    const { xmax, ymin, ymax } = escala;
    const X = (x) => IZ + x / xmax * (W - IZ - DE), Y = (y) => AR + (1 - (y - ymin) / (ymax - ymin)) * (H - AR - AB);
    const c = cortes();
    const paso = medida === 'puntaje' ? 5 : (ymax - ymin > 30 ? 10 : 5);
    const marcasY = []; for (let v = Math.ceil(ymin / paso) * paso; v <= ymax; v += paso) marcasY.push(v);
    let svg = '';
    marcasY.forEach((v) => { svg += `<line x1="${IZ}" x2="${W - DE}" y1="${Y(v)}" y2="${Y(v)}" class="${v === 0 ? 'evo-base' : 'evo-rejilla-linea'}"/><text x="${IZ - 8}" y="${Y(v) + 4}" class="evo-eje" text-anchor="end">${v}</text>`; });
    for (let w = 0; w <= xmax; w += 2) svg += `<text x="${X(w)}" y="${H - 6}" class="evo-eje" text-anchor="middle">${w}</text>`;
    [['moderado', c.moderado], ['alto', c.alto]].forEach(([nombre, v]) => {
      if (v === undefined || v === null || v > ymax || v <= 0) return;   // un corte en 0 es la misma basal
      svg += `<line x1="${IZ}" x2="${W - DE}" y1="${Y(v)}" y2="${Y(v)}" class="evo-corte"/><text x="${W - DE + 6}" y="${Y(v) + 4}" class="evo-eje">${nombre} ${v}</text>`;
    });
    if (s.pts.length) {
      svg += `<path d="${s.pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.semana).toFixed(1)} ${Y(p.valor).toFixed(1)}`).join(' ')}" class="evo-linea"/>`;
      s.pts.forEach((p, i) => { svg += `<circle cx="${X(p.semana).toFixed(1)}" cy="${Y(p.valor).toFixed(1)}" r="4.5" class="evo-punto evo-punto--${p.nivel}" data-i="${i}"/>`; });
      svg += `<line class="evo-guia" x1="0" x2="0" y1="${AR}" y2="${H - AB}" hidden/>`;
    }
    return `<svg viewBox="0 0 ${W} ${H}" class="evo-svg" role="img" aria-label="${esc(Erdm.etiqueta(g))}: ${esc(MEDIDAS[medida].eje)} por semana">${svg}</svg>`;
  }

  let datos = {};
  function pintar() {
    if (!Sesion.astronauta) return;
    const m = MEDIDAS[medida];
    $('evo-explica').textContent = m.explica;
    datos = Object.fromEntries(Erdm.GRUPOS.map((g) => [g, serie(g)]));
    // Misma escala para los 6, para poder compararlos
    const todos = Object.values(datos).flatMap((s) => s.pts);
    const c = cortes();
    const xmax = Math.max(12, Math.ceil(Math.max(0, ...todos.map((p) => p.semana)) / 2) * 2);
    let ymin = 0, ymax = 10;
    if (medida !== 'puntaje') {
      const paso = 5;
      ymin = Math.min(0, Math.floor(Math.min(0, ...todos.map((p) => p.valor)) / paso) * paso);
      ymax = Math.max(Math.ceil((c.alto * 1.25) / paso) * paso, Math.ceil(Math.max(...todos.map((p) => p.valor), 0) / paso) * paso + (paso / 1));
    }
    const escala = { xmax, ymin, ymax };
    $('evo-rejilla').innerHTML = Erdm.GRUPOS.map((g) => {
      const s = datos[g], u = s.pts[s.pts.length - 1];
      return `<figure class="tarjeta evo-panel" data-grupo="${g}">
        <figcaption class="evo-panel-cabeza">
          <span class="evo-panel-nombre">${esc(Erdm.etiqueta(g))}</span>
          ${u ? `<span class="estado estado--${u.nivel}">${esc(m.texto(u.valor))}</span>` : '<span class="estado estado--gris">Sin basal</span>'}
        </figcaption>
        ${s.pts.length ? grafica(g, s, escala) : '<p class="nota evo-vacio">Sin evaluación basal.</p>'}
        <p class="nota evo-pie">${esc(m.eje)} · semanas desde la basal</p>
      </figure>`;
    }).join('');
    pintarTabla();
  }

  function pintarTabla() {
    const m = MEDIDAS[medida];
    const semanas = [...new Set(Object.values(datos).flatMap((s) => s.pts.map((p) => Math.round(p.semana))))].sort((a, b) => a - b);
    const celda = (g, w) => { const p = datos[g].pts.find((x) => Math.round(x.semana) === w); return p ? (medida === 'puntaje' ? String(p.valor) : `${n0(p.valor, 1)} %`) : '—'; };
    $('evo-tabla').innerHTML = `<caption class="nota">${esc(m.eje)}</caption>
      <thead><tr><th scope="col">Semana</th>${Erdm.GRUPOS.map((g) => `<th scope="col">${esc(Erdm.etiqueta(g))}</th>`).join('')}</tr></thead>
      <tbody>${semanas.map((w) => `<tr><th scope="row">${w}</th>${Erdm.GRUPOS.map((g) => `<td>${celda(g, w)}</td>`).join('')}</tr>`).join('')}</tbody>`;
  }

  /* ---------------- Tooltip: el punto más cercano a la línea vertical del cursor ---------------- */
  const tip = $('evo-tooltip');
  $('evo-rejilla').addEventListener('pointermove', (e) => {
    const svg = e.target.closest('.evo-svg'); if (!svg) { ocultar(); return; }
    const panel = svg.closest('[data-grupo]'), s = datos[panel.dataset.grupo];
    const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W;
    const circulos = [...svg.querySelectorAll('.evo-punto')];
    let mejor = null, dist = Infinity;
    circulos.forEach((c) => { const d = Math.abs(Number(c.getAttribute('cx')) - x); if (d < dist) { dist = d; mejor = c; } });
    if (!mejor) return;
    const p = s.pts[Number(mejor.dataset.i)];
    const guia = svg.querySelector('.evo-guia'); guia.hidden = false; guia.setAttribute('x1', mejor.getAttribute('cx')); guia.setAttribute('x2', mejor.getAttribute('cx'));
    svg.querySelectorAll('.evo-punto').forEach((c) => c.classList.toggle('es-activo', c === mejor));
    tip.hidden = false;
    tip.innerHTML = `<p class="pequeno"><strong>${esc(Erdm.etiqueta(panel.dataset.grupo))}</strong>, semana ${Math.round(p.semana)}</p>
      <p class="nota">${Calc.fechaCorta(p.fecha)}${p.fila.fase === 'basal' ? ', basal' : ''}</p>
      <p class="pequeno">${p.fila.fase === 'basal' ? 'Referencia' : esc(MEDIDAS[medida].texto(p.valor))} · <span class="estado estado--${p.nivel}">${TEXTO_NIVEL[p.nivel]}</span></p>`;
    const cr = mejor.getBoundingClientRect();
    const izq = Math.min(window.innerWidth - tip.offsetWidth - 12, Math.max(12, cr.left + cr.width / 2 - tip.offsetWidth / 2));
    tip.style.left = `${izq + window.scrollX}px`;
    tip.style.top = `${cr.top + window.scrollY - tip.offsetHeight - 12}px`;
  });
  function ocultar() {
    tip.hidden = true;
    document.querySelectorAll('#evo-rejilla .evo-guia').forEach((g) => { g.hidden = true; });
    document.querySelectorAll('#evo-rejilla .evo-punto.es-activo').forEach((c) => c.classList.remove('es-activo'));
  }
  $('evo-rejilla').addEventListener('pointerleave', ocultar);

  $('evo-medida').addEventListener('cambio', (e) => { medida = e.detail; ocultar(); pintar(); });
  document.addEventListener('astronauta-elegido', pintar);
  document.addEventListener('datos-actualizados', pintar);
})();
</script>
