<!--
  JsErdm.html — Escala ERDM-A (Escala de Riesgo de Desacondicionamiento Muscular en Astronautas). Sin nada visual.
  Reglas tomadas del documento ASTRA-FIT (pestaña ESCALA): 5 dimensiones de 0 a 2 puntos, máximo 10 por músculo.
    Erdm.MUSCULOS                      → los 6 músculos de la escala
    Erdm.puntuar(cambios)              → { puntos: {fuerza, coord, circ, emg, vo2}, total, nivel, prioritaria, motivos }
    Erdm.simular(astronauta, semana)   → { musculo: cambios } con datos SIMULADOS (no hay mediciones reales)
    Erdm.serie(astronauta, musculo)    → puntaje por semana 0..12
  "cambios" = { fuerza, coord, circ, emg, vo2 }: porcentajes frente al valor basal del propio astronauta
  (fuerza, circ y vo2 = pérdida %; coord y emg = cambio % en cualquier dirección).
  Los puntos de corte son provisionales (el documento dice que la escala no está validada).
-->
<script>
const Erdm = (() => {
  const MUSCULOS = [
    { clave: 'soleo', nombre: 'Sóleo', region: 'inferior' },
    { clave: 'gastrocnemio', nombre: 'Gastrocnemio', region: 'inferior' },
    { clave: 'cuadriceps', nombre: 'Cuádriceps', region: 'inferior' },
    { clave: 'biceps', nombre: 'Bíceps braquial', region: 'superior' },
    { clave: 'triceps', nombre: 'Tríceps braquial', region: 'superior' },
    { clave: 'antebrazo', nombre: 'Flexores del antebrazo', region: 'superior' }
  ];
  const DIMENSIONES = [
    { clave: 'fuerza', nombre: 'Fuerza', metodo: 'Dinamometría', detalle: 'Pérdida de fuerza' },
    { clave: 'coord', nombre: 'Coordinación', metodo: 'IMU (CV entre repeticiones)', detalle: 'Cambio de variabilidad' },
    { clave: 'circ', nombre: 'Circunferencia', metodo: 'Cinta métrica', detalle: 'Pérdida de circunferencia' },
    { clave: 'emg', nombre: 'Función neuromuscular', metodo: 'EMG (RMS y frecuencia mediana)', detalle: 'Cambio frente al basal' },
    { clave: 'vo2', nombre: 'Capacidad funcional', metodo: 'VO₂pico (sistémico)', detalle: 'Disminución de VO₂pico' }
  ];

  /* Tablas del documento. Cada una da [corte para 1 punto, corte para 2 puntos] */
  const CORTES = {
    fuerza: { uno: 0, dos: 10 },    // 0 → 0 pts; >0 y ≤10 → 1; >10 → 2
    coord:  { uno: 10, dos: 20 },   // <10 → 0; 10–20 → 1; >20 → 2
    circ:   { uno: 5, dos: 10 },    // <5 → 0; 5–10 → 1; >10 → 2
    emg:    { uno: 10, dos: 20 },   // <10 → 0; 10–20 → 1; >20 → 2
    vo2:    { uno: 5, dos: 10 }     // <5 → 0; 5–10 → 1; >10 → 2
  };
  function puntosDe(clave, valor) {
    if (!Number.isFinite(valor)) return 0;
    const v = clave === 'coord' || clave === 'emg' ? Math.abs(valor) : valor;
    const c = CORTES[clave];
    if (clave === 'fuerza') return v <= 0 ? 0 : v <= c.dos ? 1 : 2;
    return v < c.uno ? 0 : v <= c.dos ? 1 : 2;
  }
  function nivelDe(total) { return total <= 3 ? 'verde' : total <= 6 ? 'amarillo' : 'rojo'; }

  function puntuar(c) {
    const puntos = {};
    DIMENSIONES.forEach((d) => { puntos[d.clave] = puntosDe(d.clave, c[d.clave]); });
    const total = DIMENSIONES.reduce((s, d) => s + puntos[d.clave], 0);
    // Regla de alerta prioritaria: un deterioro marcado en una sola dimensión no debe quedar oculto por la suma
    const motivos = [];
    if (c.fuerza > 20) motivos.push('Pérdida de fuerza superior al 20 %');
    if (c.circ > 15) motivos.push('Pérdida de circunferencia superior al 15 %');
    return { puntos, total, nivel: nivelDe(total), prioritaria: motivos.length > 0, motivos };
  }

  /* ---------------- Simulación determinista (misma semilla = mismos números) ---------------- */
  function semilla(texto) { let h = 2166136261; for (const ch of texto) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
  function azar(s) { let t = s + 0x6D2B79F5; return () => { t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  // Cambio final (semana 12) por escenario; las piernas se deterioran más que los brazos (antigravitatorios)
  const FINAL = {
    estable:        { fuerza: 2,  coord: 4,  circ: 1.5, emg: 5,  vo2: 2 },
    perdida_fuerza: { fuerza: 19, coord: 9,  circ: 8,   emg: 14, vo2: 8 },
    asimetria:      { fuerza: 7,  coord: 24, circ: 4,   emg: 17, vo2: 4 }
  };
  const PESO_REGION = { inferior: 1, superior: 0.55 };

  function simular(astronauta, semana = 12) {
    const base = FINAL[astronauta.escenario] || FINAL.estable;
    const avance = Math.max(0, Math.min(1, semana / 12));
    const salida = {};
    MUSCULOS.forEach((m) => {
      const az = azar(semilla(astronauta.id_astronauta + m.clave));
      const peso = PESO_REGION[m.region] * (0.85 + az() * 0.3);
      const ruido = () => (az() - 0.5) * 2;
      const c = {};
      ['fuerza', 'circ'].forEach((k) => { c[k] = Math.max(0, base[k] * peso * avance + ruido() * 0.8 * avance); });
      ['coord', 'emg'].forEach((k) => { c[k] = (base[k] * (0.8 + peso * 0.2) * avance + ruido() * 1.2 * avance) * (az() > 0.25 ? 1 : -1); });
      salida[m.clave] = c;
    });
    // VO₂pico es sistémico: un solo valor para todos los músculos
    const az2 = azar(semilla(astronauta.id_astronauta + 'vo2'));
    const vo2 = Math.max(0, base.vo2 * avance + (az2() - 0.5) * 1.2 * avance);
    MUSCULOS.forEach((m) => { salida[m.clave].vo2 = vo2; });
    return salida;
  }

  function serie(astronauta, musculo) {
    return Array.from({ length: 13 }, (_, w) => puntuar(simular(astronauta, w)[musculo]).total);
  }

  return { MUSCULOS, DIMENSIONES, CORTES, puntuar, simular, serie, nivelDe };
})();
</script>
