<!--
  JsErdm.html — Escala ERDM-A (Escala de Riesgo de Desacondicionamiento Muscular en Astronautas).
  Fuente: documento ASTRA-FIT, pestaña ESCALA. Propuesta del equipo, no es una escala clínica validada.

  6 grupos musculares × 5 dimensiones, cada una de 0 a 2 puntos frente a la evaluación basal del mismo músculo:
    fuerza (dinamometría) · coordinación (IMU, CV entre repeticiones) · circunferencia (cinta)
    EMG (mayor cambio entre RMS y frecuencia mediana) · VO2pico (sistémico, igual para los 6 músculos)
  Total 0–10: 0–3 bajo, 4–6 moderado, 7–10 alto. Alerta prioritaria si la fuerza cae más de 20 % o la circunferencia más de 15 %.
  Los cortes se leen de la pestaña EscalaERDM (si falta, se usan los del documento).

  Funciones:
    Erdm.calcular(fila)                 → la fila con cambios, puntajes, puntaje_erdm, riesgo y alerta_prioritaria.
                                          Si a la fila le falta una dimensión (p. ej. el sensor midió hoy EMG y coordinación,
                                          pero la fuerza se midió hace una semana), usa el último valor de misión de esa
                                          dimensión y lo anota en `arrastre`. Nunca arrastra valores de la basal.
    Erdm.ultima(idAstronauta, grupo)    → última evaluación del músculo, ya calculada (o null)
    Erdm.historial(idAstronauta, grupo) → todas sus evaluaciones, de la más antigua a la más reciente
    Erdm.basal(idAstronauta, grupo)     → evaluación basal del músculo (o null)
    Erdm.alertas(filas)                 → alertas nuevas si el riesgo subió (para API.guardarAlertas)
    Erdm.nota(alerta)                   → nota clínica breve: { musculo, resumen, hallazgos[], conducta, texto }
    Erdm.plan(grupo, riesgo)            → { ejercicio, dosificacion } de la pestaña PlanFortalecimiento
    Erdm.DIMENSIONES / Erdm.GRUPOS / Erdm.nivel(riesgo) / Erdm.idEvaluacion(id, fecha, grupo)
  Usa Sesion.datos (lo carga SeccionAcceso.html).
-->
<script>
const Erdm = (() => {
  const GRUPOS = ['soleo', 'gastrocnemio', 'cuadriceps', 'biceps_braquial', 'triceps_braquial', 'flexores_antebrazo'];

  // Orden, columnas y textos de cada dimensión. `signo`: cómo se muestra el cambio (pérdida = −, aumento = +).
  const DIMENSIONES = [
    { clave: 'fuerza', nombre: 'Fuerza', metodo: 'Dinamometría', campos: ['fuerza_kg'], unidad: 'kg', cambio: 'cambio_fuerza_pct', puntos: 'p_fuerza', signo: -1, manual: false },
    { clave: 'coordinacion', nombre: 'Coordinación', metodo: 'IMU', campos: ['coordinacion_cv_pct'], unidad: '% CV', cambio: 'cambio_coordinacion_pct', puntos: 'p_coordinacion', signo: 1, manual: false },
    { clave: 'circunferencia', nombre: 'Circunferencia', metodo: 'Cinta métrica', campos: ['circunferencia_cm'], unidad: 'cm', cambio: 'cambio_circunferencia_pct', puntos: 'p_circunferencia', signo: -1, manual: true },
    { clave: 'emg', nombre: 'EMG', metodo: 'Electromiografía', campos: ['emg_rms_uv', 'emg_frec_mediana_hz'], unidad: '', cambio: 'cambio_emg_pct', puntos: 'p_emg', signo: 0, manual: false },
    { clave: 'vo2pico', nombre: 'VO₂pico', metodo: 'Capacidad funcional', campos: ['vo2pico_ml_kg_min'], unidad: 'mL/kg/min', cambio: 'cambio_vo2_pct', puntos: 'p_vo2', signo: -1, manual: true }
  ];

  // Cortes del documento, por si la pestaña EscalaERDM no existe o le falta una fila
  const POR_DEFECTO = {
    fuerza: { moderado_desde: 0, alto_desde: 10, prioritaria_desde: 20 },
    coordinacion: { moderado_desde: 10, alto_desde: 20 },
    circunferencia: { moderado_desde: 5, alto_desde: 10, prioritaria_desde: 15 },
    emg: { moderado_desde: 10, alto_desde: 20 },
    vo2pico: { moderado_desde: 5, alto_desde: 10 },
    total: { moderado_desde: 4, alto_desde: 7 }
  };
  function corte(dimension) {
    const fila = ((Sesion.datos && Sesion.datos.EscalaERDM) || []).find((e) => e.dimension === dimension) || {};
    const def = POR_DEFECTO[dimension] || {};
    const n = (v, d) => (v === null || v === undefined || v === '' ? d : Number(v));
    return { moderado: n(fila.moderado_desde, def.moderado_desde), alto: n(fila.alto_desde, def.alto_desde), prioritaria: n(fila.prioritaria_desde, def.prioritaria_desde) };
  }

  const num = (v) => (v === null || v === undefined || v === '' || isNaN(Number(v)) ? null : Number(v));
  const r1 = (v) => (v === null ? null : Math.round(v * 10) / 10);
  const evaluaciones = () => (Sesion.datos && Sesion.datos.Evaluaciones) || [];
  const delMusculo = (id, grupo) => evaluaciones().filter((e) => e.id_astronauta === id && e.grupo_muscular === grupo)
    .sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)));

  function basal(id, grupo, antesDe) {
    const b = delMusculo(id, grupo).filter((e) => e.fase === 'basal' && (!antesDe || String(e.fecha) <= String(antesDe)));
    return b.length ? b[b.length - 1] : null;
  }

  /** Cambio en %, positivo = empeora. null si falta el dato actual o el basal. */
  function cambioDe(dim, fila, b) {
    if (!b) return null;
    if (dim.clave === 'emg') {
      const cambios = dim.campos.map((c) => { const a = num(fila[c]), x = num(b[c]); return a === null || !x ? null : Math.abs(a / x - 1) * 100; }).filter((v) => v !== null);
      return cambios.length ? Math.max(...cambios) : null;
    }
    const a = num(fila[dim.campos[0]]), x = num(b[dim.campos[0]]);
    if (a === null || !x) return null;
    return dim.clave === 'coordinacion' ? (a - x) / x * 100 : (x - a) / x * 100;
  }

  function puntos(clave, cambio) {
    if (cambio === null) return null;
    const c = corte(clave);
    if (cambio > c.alto) return 2;
    if (c.moderado === 0 ? cambio > 0 : cambio >= c.moderado) return 1;
    return 0;
  }

  function riesgoDe(total) {
    const c = corte('total');
    return total >= c.alto ? 'alto' : total >= c.moderado ? 'moderado' : 'bajo';
  }

  /** Últimos valores de misión (no basales) de cada dimensión, anteriores o iguales a la fecha, que le faltan a la fila. */
  function completar(fila) {
    const previas = delMusculo(fila.id_astronauta, fila.grupo_muscular)
      .filter((e) => e.fase !== 'basal' && String(e.fecha) <= String(fila.fecha) && e.id_evaluacion !== fila.id_evaluacion);
    const valores = { ...fila }, arrastre = [];
    DIMENSIONES.forEach((dim) => {
      if (dim.campos.some((c) => num(fila[c]) !== null)) return;
      for (let i = previas.length - 1; i >= 0; i--) {
        if (dim.campos.some((c) => num(previas[i][c]) !== null)) {
          dim.campos.forEach((c) => { valores[c] = previas[i][c]; });
          arrastre.push({ clave: dim.clave, fecha: previas[i].fecha });
          break;
        }
      }
    });
    return { valores, arrastre };
  }

  /** Devuelve una copia de la fila con todos los campos calculados de la escala. */
  function calcular(original) {
    const esBasal = original.fase === 'basal';
    const { valores: fila, arrastre } = esBasal ? { valores: original, arrastre: [] } : completar(original);
    const salida = { ...original };
    const b = esBasal ? null : basal(fila.id_astronauta, fila.grupo_muscular, fila.fecha);
    let total = 0, medidas = 0;
    DIMENSIONES.forEach((dim) => {
      const cambio = esBasal ? null : cambioDe(dim, fila, b);
      const p = esBasal ? (dim.campos.some((c) => num(fila[c]) !== null) ? 0 : null) : puntos(dim.clave, cambio);
      salida[dim.cambio] = r1(cambio);
      salida[dim.puntos] = p;
      if (p !== null) { total += p; medidas += 1; }
    });
    const cf = salida.cambio_fuerza_pct, cc = salida.cambio_circunferencia_pct;
    const prioritaria = !esBasal && ((cf !== null && cf > corte('fuerza').prioritaria) || (cc !== null && cc > corte('circunferencia').prioritaria));
    salida.puntaje_erdm = total;
    salida.riesgo = riesgoDe(total);
    salida.alerta_prioritaria = prioritaria ? 'SI' : 'NO';
    salida.dimensiones_medidas = medidas;   // solo en memoria: cuántas de las 5 tienen dato
    salida.sin_basal = !esBasal && !b;
    salida.arrastre = arrastre;              // solo en memoria: dimensiones tomadas de una evaluación anterior
    salida.valores = fila;                   // solo en memoria: valores usados (con lo arrastrado)
    return salida;
  }

  const historial = (id, grupo) => delMusculo(id, grupo).map(calcular);
  function ultima(id, grupo) {
    const h = delMusculo(id, grupo);
    return h.length ? calcular(h[h.length - 1]) : null;
  }

  const NIVEL = { bajo: 'verde', moderado: 'amarillo', alto: 'rojo' };
  const ORDEN = { bajo: 0, moderado: 1, alto: 2 };
  const nivel = (riesgo) => NIVEL[riesgo] || 'verde';

  function etiqueta(grupo) {
    const c = ((Sesion.datos && Sesion.datos.Catalogos) || []).find((x) => x.lista === 'grupo_muscular' && x.valor === grupo);
    return c ? c.etiqueta : grupo;
  }

  function plan(grupo, riesgo) {
    return ((Sesion.datos && Sesion.datos.PlanFortalecimiento) || []).find((p) => p.grupo_muscular === grupo && p.riesgo === riesgo) || null;
  }

  function resumenCambios(f) {
    const partes = [];
    DIMENSIONES.forEach((d) => {
      const v = f[d.cambio];
      if (v === null || v === undefined) return;
      if (d.clave === 'emg') partes.push(`EMG cambió ${Math.round(v)} %`);
      else { const x = d.signo * v; partes.push(`${d.nombre.toLowerCase().replace('vo₂pico', 'VO₂pico')} ${x < 0 ? '−' : '+'}${Math.abs(Math.round(x))} %`); }
    });
    const t = partes.join(', ');
    return t ? t[0].toUpperCase() + t.slice(1) : '';
  }

  /** Nota clínica breve de una alerta, para mostrarla: músculo, puntaje, hallazgos frente a la basal y conducta.
      Se arma desde la evaluación que la originó (alerta.origen); si no se encuentra, usa el mensaje guardado. */
  const CONDUCTA = {
    prioritaria: 'Evaluación prioritaria por el médico de vuelo antes de continuar la progresión de carga.',
    alto: 'Valoración por el médico de vuelo antes de intensificar. Carga baja y progresión supervisada.',
    moderado: 'Aumentar el trabajo específico del músculo. Reevaluar en el próximo control semanal.',
    bajo: 'Mantener el programa preventivo.'
  };
  function nota(alerta) {
    const fila = evaluaciones().find((e) => e.id_evaluacion === alerta.origen);
    if (!fila) return { musculo: alerta.grupo_muscular ? etiqueta(alerta.grupo_muscular) : '', resumen: '', hallazgos: [], conducta: '', texto: alerta.mensaje || '' };
    const f = calcular(fila), prior = f.alerta_prioritaria === 'SI';
    const hallazgos = DIMENSIONES.map((d) => {
      const v = f[d.cambio]; if (v === null || v === undefined) return null;
      const x = d.clave === 'emg' ? Math.abs(v) : d.signo * v, r = Math.abs(Math.round(x));
      const valor = d.clave === 'emg' ? `Δ ${r} %` : `${x < 0 ? '−' : '+'}${r} %`;
      return { nombre: d.clave === 'coordinacion' ? 'Variabilidad (IMU)' : d.nombre, valor, puntos: Number(f[d.puntos]) || 0 };
    }).filter(Boolean);
    const alterados = hallazgos.filter((h) => h.puntos > 0);
    return {
      musculo: etiqueta(f.grupo_muscular),
      resumen: `ERDM-A ${f.puntaje_erdm}/10, riesgo ${f.riesgo}${prior ? ', criterio de evaluación prioritaria' : ''}`,
      hallazgos: alterados.length ? alterados : hallazgos,
      conducta: CONDUCTA[prior ? 'prioritaria' : f.riesgo] || '',
      texto: ''
    };
  }

  /** La misma nota en HTML (la usan Alertas y el Estado de hoy del Perfil). */
  function notaHtml(alerta) {
    const n = nota(alerta), e = (t) => UI.esc(t);
    if (n.texto) return `<p class="texto">${e(n.texto)}</p>${alerta.recomendacion ? `<p class="pequeno texto-2">${e(alerta.recomendacion)}</p>` : ''}`;
    return `<p class="texto"><strong>${e(n.musculo)}.</strong> ${e(n.resumen)}.</p>
      <ul class="nota-hallazgos">${n.hallazgos.map((h) => `<li><span>${e(h.nombre)}</span> <strong>${e(h.valor)}</strong></li>`).join('')}</ul>
      ${n.conducta ? `<p class="pequeno"><span class="texto-2">Conducta:</span> ${e(n.conducta)}</p>` : ''}`;
  }

  /** Alertas para filas recién guardadas: si el riesgo subió frente a la evaluación anterior, o hay alerta prioritaria nueva. */
  function alertas(filas) {
    const ahora = (() => { const d = new Date(), p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; })();
    const nuevas = [];
    filas.forEach((fila) => {
      const f = calcular(fila);
      if (f.fase === 'basal' || f.sin_basal) return;
      const previas = delMusculo(f.id_astronauta, f.grupo_muscular).filter((e) => String(e.fecha) < String(f.fecha) && e.fase !== 'basal').map(calcular);
      const peorPrevio = previas.reduce((m, e) => Math.max(m, ORDEN[e.riesgo]), 0);
      const priorPrevia = previas.some((e) => e.alerta_prioritaria === 'SI');
      const prior = f.alerta_prioritaria === 'SI';
      if (!(ORDEN[f.riesgo] > peorPrevio || (prior && !priorPrevia))) return;
      nuevas.push({
        creada_en: ahora, id_astronauta: f.id_astronauta, origen: f.id_evaluacion, grupo_muscular: f.grupo_muscular,
        indicador: 'puntaje_erdm', valor_actual: f.puntaje_erdm, valor_basal: 0, cambio_pct: null,
        nivel: prior ? 'rojo' : nivel(f.riesgo),
        mensaje: `${etiqueta(f.grupo_muscular)}. ERDM-A ${f.puntaje_erdm}/10, riesgo ${f.riesgo}${prior ? ', criterio de evaluación prioritaria' : ''}. ${resumenCambios(f)} frente a la basal.`,
        recomendacion: CONDUCTA[prior ? 'prioritaria' : f.riesgo] || '',
        estado: 'abierta', atendida_por: '', nota_cierre: ''
      });
    });
    return nuevas;
  }

  const idEvaluacion = (id, fecha, grupo) => `EVA-${String(id).replace('-', '')}-${String(fecha).replace(/-/g, '')}-${grupo}`;

  /** Solo las columnas que se guardan en el Sheet (sin los campos de memoria). */
  function paraGuardar(f) {
    const { dimensiones_medidas, sin_basal, arrastre, valores, ...resto } = f;
    return resto;
  }

  return { GRUPOS, DIMENSIONES, calcular, ultima, historial, basal, alertas, nota, notaHtml, plan, nivel, etiqueta, idEvaluacion, paraGuardar, resumenCambios, corte };
})();
</script>
