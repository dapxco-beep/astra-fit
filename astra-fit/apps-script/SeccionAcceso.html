<!-- SeccionAcceso.html — Pantalla de entrada: logo, elegir astronauta o registrar uno nuevo.
     Fondo: blanco.  Lee la pestaña Astronautas por medio de API.  El registro y la edición viven en FormPerfil.html.
     Al elegir un astronauta guarda Sesion.astronauta y avisa con el evento "astronauta-elegido". -->
<main class="acceso" aria-labelledby="acceso-titulo">
  <div class="contenedor">
    <?!= include('Logo'); ?>
    <div class="marca">
      <h1 class="marca-nombre" id="acceso-titulo">MYOCARE</h1>
      <p class="marca-significado" lang="en"><b>M</b>uscle <b>Y</b>ield <b>O</b>bservation, <b>C</b>onditioning <b>a</b>nd <b>R</b>isk <b>E</b>valuation</p>
    </div>
    <h2 class="titulo-tarjeta acceso-tripulacion">Tripulación</h2>

    <div class="perfiles" id="perfiles" aria-live="polite">
      <p class="texto-2" style="grid-column: 1 / -1">Cargando tripulación…</p>
    </div>
  </div>
</main>

<script>
const Sesion = { datos: null, astronauta: null };

(() => {
  const $ = (id) => document.getElementById(id);

  function textoDia(a) {
    const d = Calc.diasDesde(a.fecha_inicio_mision);
    if (d === null) return a.id_astronauta;
    return d < 0 ? `${a.id_astronauta}, despega en ${-d} días` : `${a.id_astronauta}, día ${d} de misión`;
  }

  /* ---------------- Tarjetas de la tripulación ---------------- */
  function dibujarPerfiles() {
    const activos = Sesion.datos.Astronautas.filter((a) => a.activo !== 'NO');
    $('perfiles').innerHTML = activos.map((a) => `
      <button type="button" class="perfil" data-id="${UI.esc(a.id_astronauta)}">
        ${UI.avatar(a)}
        <span class="titulo-tarjeta">${UI.esc(a.nombre)}</span>
        <span class="texto-2">${UI.esc(a.rol || 'Tripulante')}</span>
        <span class="nota">${UI.esc(textoDia(a))}</span>
        <span class="enlace">Abrir panel</span>
      </button>`).join('') + `
      <button type="button" class="perfil perfil-nuevo" id="btn-nuevo-astronauta">
        <span class="avatar" aria-hidden="true">+</span>
        <span class="titulo-tarjeta">Registrar tripulante</span>
        <span class="texto-2">Datos personales y de la misión</span>
      </button>`;
  }

  $('perfiles').addEventListener('click', (e) => {
    if (e.target.closest('#btn-nuevo-astronauta')) return Perfil.abrir('crear');
    const tarjeta = e.target.closest('.perfil[data-id]');
    if (tarjeta) elegir(tarjeta.dataset.id);
  });
  document.addEventListener('astronauta-guardado', dibujarPerfiles);
  document.addEventListener('astronauta-actualizado', dibujarPerfiles);
  document.addEventListener('astronauta-eliminado', dibujarPerfiles);

  const CLAVE = 'myocare-astronauta';
  function elegir(id) {
    Sesion.astronauta = Sesion.datos.Astronautas.find((a) => a.id_astronauta === id);
    if (!Sesion.astronauta) return;
    try { sessionStorage.setItem(CLAVE, id); } catch (e) { /* sin almacenamiento: no pasa nada */ }
    $('vista-acceso').hidden = true;
    $('vista-panel').hidden = false;
    window.scrollTo(0, 0);
    document.dispatchEvent(new CustomEvent('astronauta-elegido', { detail: Sesion.astronauta }));
  }

  /* Volver a la pantalla de entrada (lo usa el botón "Cambiar" de la barra superior) */
  Sesion.salir = () => {
    Sesion.astronauta = null;
    document.dispatchEvent(new CustomEvent('sesion-cerrada'));   // Monitoreo cancela lo que estuviera midiendo
    try { sessionStorage.removeItem(CLAVE); } catch (e) { /* idem */ }
    // Al elegir de nuevo se entra por el perfil, no por la última vista del astronauta anterior
    try { history.replaceState(null, '', location.pathname + location.search + '#inicio'); } catch (e) { /* idem */ }
    $('vista-panel').hidden = true;
    $('vista-acceso').hidden = false;
    window.scrollTo(0, 0);
    const t = $('acceso-titulo'); t.setAttribute('tabindex', '-1'); t.focus({ preventScroll: true });
  };

  /* ---------------- Carga inicial ---------------- */
  function cargar() {
    API.obtenerDatos()
      .then((datos) => {
        Sesion.datos = datos; dibujarPerfiles();
        // Recargar no saca del panel: se vuelve a abrir el astronauta de esta pestaña, en la misma vista
        let previo = null; try { previo = sessionStorage.getItem(CLAVE); } catch (e) { /* idem */ }
        if (previo && datos.Astronautas.some((a) => a.id_astronauta === previo && a.activo !== 'NO')) elegir(previo);
      })
      .catch(() => {
        $('perfiles').innerHTML = '<div class="pila" style="grid-column:1/-1; justify-items:center"><p class="texto" role="alert" style="color: var(--rojo-texto)">No se pudo cargar la tripulación. Verifique la conexión y vuelva a intentar.</p><button type="button" class="boton" id="reintentar-carga">Reintentar</button></div>';
        $('reintentar-carga').addEventListener('click', () => { $('perfiles').innerHTML = '<p class="texto-2" style="grid-column:1/-1">Cargando…</p>'; cargar(); });
        UI.aviso('Sin conexión con la base de datos. Tus datos no se perdieron.', 'error');
      });
  }
  cargar();
})();
</script>
