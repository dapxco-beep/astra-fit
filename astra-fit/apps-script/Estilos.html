<!--
  Estilos.html — FORMATO ÚNICO DE ASTRA-FIT
  Lenguaje visual inspirado en el sitio de Apple + reglas de la skill apple-design
  (tipografía por tamaño, barra translúcida, respuesta al presionar, accesibilidad).

  REGLA DEL EQUIPO: ningún otro archivo define colores, tamaños de letra, radios ni sombras.
  Si necesitas algo nuevo, agrégalo AQUÍ como variable o clase y avisa al equipo.
  Ver la página de componentes:  ?page=componentes
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
/* ================================================================ 1. TOKENS */
:root {
  /* Superficies */
  --fondo: #f5f5f7;             /* gris de página */
  --blanco: #ffffff;            /* secciones y tarjetas claras */
  --negro: #000000;             /* secciones oscuras (lo visual: el cuerpo) */
  --carbon: #1d1d1f;            /* tarjetas sobre negro */

  /* Texto */
  --tinta: #1d1d1f;             /* principal */
  --tinta-2: #6e6e73;           /* secundario */
  --tinta-3: #6b6b70;           /* notas, ejes, ayudas (oscurecido para contraste AA sobre blanco y gris) */
  --tinta-clara: #f5f5f7;       /* principal sobre negro */
  --tinta-clara-2: #a1a1a6;     /* secundario sobre negro */

  /* Líneas */
  --linea: #d2d2d7;
  --linea-suave: rgba(0, 0, 0, .08);
  --linea-oscura: rgba(255, 255, 255, .14);

  /* Acento: acciones y enlaces */
  --azul: #0071e3;
  --azul-hover: #0077ed;
  --azul-enlace: #0066cc;
  --azul-sobre-negro: #2997ff;
  --anillo-foco: rgba(0, 113, 227, .45);

  /* Semáforo: punto, texto legible y fondo suave */
  --verde: #34c759;     --verde-texto: #1e7a35;     --verde-fondo: #e9f8ee;
  --amarillo: #ff9f0a;  --amarillo-texto: #b25000;  --amarillo-fondo: #fff4e5;
  --rojo: #ff3b30;      --rojo-texto: #d70015;      --rojo-fondo: #ffeceb;
  --gris-estado: #aeaeb2;

  /* Tipografía: fuente del sistema (en Mac se ve San Francisco; en Windows, Inter) */
  --fuente: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --t-hero: clamp(2.75rem, 6vw, 4.75rem);       /* 44–76 px */
  --t-titulo: clamp(2rem, 4.2vw, 3rem);          /* 32–48 px */
  --t-subtitulo: clamp(1.1875rem, 2vw, 1.5rem);  /* 19–24 px */
  --t-tarjeta: 1.5rem;                            /* 24 px */
  --t-cuerpo: 1.0625rem;                          /* 17 px */
  --t-pequeno: .875rem;                           /* 14 px */
  --t-nota: .8125rem;                             /* 13 px */

  /* Espacios (múltiplos de 4) */
  --e-1: 4px; --e-2: 8px; --e-3: 12px; --e-4: 16px; --e-5: 20px; --e-6: 24px;
  --e-8: 32px; --e-10: 40px; --e-12: 48px; --e-16: 64px;
  --seccion-y: clamp(72px, 10vw, 128px);

  /* Forma y profundidad */
  --radio-tarjeta: 28px;
  --radio-control: 12px;
  --radio-pildora: 980px;
  --sombra-suave: 0 2px 12px rgba(0, 0, 0, .06);
  --ancho: 1080px;
  --material-claro: rgba(251, 251, 253, .78);
  --material-oscuro: rgba(22, 22, 23, .78);
}

/* ================================================================ 2. BASE */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 56px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--fondo); color: var(--tinta);
  font-family: var(--fuente); font-size: var(--t-cuerpo); line-height: 1.47;
  letter-spacing: -0.01em; font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
h1, h2, h3, h4, p, figure { margin: 0; }
img, svg, canvas { display: block; max-width: 100%; }
button, input, select, textarea { font: inherit; letter-spacing: inherit; color: inherit; }
a { color: var(--azul-enlace); }
:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; border-radius: 8px; }
.seccion--negra :focus-visible { outline-color: var(--azul-sobre-negro); }
.contenedor { width: min(var(--ancho), 100% - 44px); margin-inline: auto; }
.oculto, [hidden] { display: none !important; }
.solo-lector { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ================================================================ 3. TIPOGRAFÍA
   Regla: cuanto más grande la letra, más apretado el espaciado y menor el interlineado. */
.hero-titulo { font-size: var(--t-hero); line-height: 1.05; font-weight: 600; letter-spacing: -0.02em; }
.titulo      { font-size: var(--t-titulo); line-height: 1.08; font-weight: 600; letter-spacing: -0.02em; }
.subtitulo   { font-size: var(--t-subtitulo); line-height: 1.33; font-weight: 400; letter-spacing: -0.005em; color: var(--tinta-2); }
.titulo-tarjeta { font-size: var(--t-tarjeta); line-height: 1.17; font-weight: 600; letter-spacing: -0.012em; }
.texto       { font-size: var(--t-cuerpo); line-height: 1.47; }
.texto-2     { color: var(--tinta-2); }
.pequeno     { font-size: var(--t-pequeno); line-height: 1.43; letter-spacing: -0.005em; }
.nota        { font-size: var(--t-nota); line-height: 1.33; letter-spacing: 0; color: var(--tinta-3); }
.hero-titulo, .titulo, .subtitulo { text-wrap: balance; }
.cifra       { font-size: clamp(2.5rem, 5vw, 3.5rem); line-height: 1.05; font-weight: 600; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
.cifra small { font-size: .45em; font-weight: 600; margin-left: 2px; letter-spacing: 0; }

/* ================================================================ 4. BARRA SUPERIOR (material translúcido) */
.nav-marca { margin-right: auto; font-size: 1.1875rem; font-weight: 600; letter-spacing: -0.015em; color: var(--tinta); text-decoration: none; white-space: nowrap; }
.nav-etiqueta { font-size: 11px; padding: 3px 10px; border-radius: var(--radio-pildora); background: var(--amarillo-fondo); color: var(--amarillo-texto); }
.nav-marca, .nav-etiqueta { white-space: nowrap; }

/* ================================================================ 5. SECCIONES */
.seccion { padding: var(--seccion-y) 0; }
.seccion--blanca { background: var(--blanco); }
.seccion--gris { background: var(--fondo); }
.seccion--negra { background: var(--negro); color: var(--tinta-clara); }
.seccion--negra .subtitulo, .seccion--negra .texto-2 { color: var(--tinta-clara-2); }
.seccion-cabecera { max-width: 880px; margin: 0 auto var(--e-10); text-align: center; display: grid; gap: var(--e-4); justify-items: center; }

/* Hero: lo primero que se ve */
.hero { padding: clamp(64px, 9vw, 112px) 0 clamp(56px, 7vw, 88px); background: var(--blanco); text-align: center; }
.hero .contenedor { display: grid; gap: var(--e-5); justify-items: center; }
.hero .subtitulo { max-width: 720px; }
.acciones { display: flex; flex-wrap: wrap; gap: var(--e-4); justify-content: center; align-items: center; }

/* ================================================================ 6. TARJETAS Y REJILLAS */
.tarjeta { background: var(--blanco); border-radius: var(--radio-tarjeta); padding: clamp(24px, 3.5vw, 40px); }
.seccion--blanca .tarjeta { background: var(--fondo); }
.seccion--negra .tarjeta { background: var(--carbon); }
.tarjeta--elevada { box-shadow: var(--sombra-suave); }
.pila { display: grid; gap: var(--e-3); align-content: start; }
.rejilla { display: grid; gap: var(--e-5); }
.rejilla-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.rejilla-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 833px) { .rejilla-2, .rejilla-3 { grid-template-columns: 1fr; } }

/* Espacio reservado: dónde va algo que aún se está construyendo */
.reservado {
  width: 100%; min-height: 300px; border-radius: var(--radio-tarjeta); border: 1.5px dashed var(--linea);
  display: grid; place-content: center; justify-items: center; gap: var(--e-2); padding: var(--e-10); text-align: center; color: var(--tinta-3);
}
.reservado strong { color: var(--tinta-2); font-weight: 600; font-size: var(--t-cuerpo); }
.reservado code { font-size: var(--t-nota); background: rgba(0, 0, 0, .05); padding: 2px 8px; border-radius: 6px; }
.seccion--negra .reservado { border-color: var(--linea-oscura); color: var(--tinta-clara-2); }
.seccion--negra .reservado strong { color: var(--tinta-clara); }
.seccion--negra .reservado code { background: rgba(255, 255, 255, .1); }
.reservado--alto { min-height: 520px; }

/* ---- Visor del cuerpo (SeccionCuerpo): lienzo 3D + panel de grupos musculares ---- */
.cuerpo-rejilla { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr); gap: var(--e-5); align-items: stretch; }
.visor { position: relative; min-height: 560px; border-radius: var(--radio-tarjeta); overflow: hidden; background: var(--carbon); }
.visor canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.visor-carga { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: var(--e-3); text-align: center; padding: var(--e-6); color: var(--tinta-clara-2); background: var(--carbon); }
.visor-carga[hidden] { display: none; }
.visor-pista { position: absolute; left: var(--e-4); top: var(--e-4); padding: var(--e-1) var(--e-3); border-radius: var(--radio-pildora); background: rgba(0, 0, 0, .55); font-size: var(--t-nota); color: var(--tinta-clara); pointer-events: none; opacity: 0; transition: opacity .15s; }
.visor-pista.visible { opacity: 1; }
.cuerpo-controles { display: flex; flex-wrap: wrap; gap: var(--e-4) var(--e-6); margin-top: var(--e-5); align-items: center; }
.cuerpo-controles > div { min-width: 0; max-width: 100%; }
.cuerpo-controles .nota { margin-right: var(--e-2); color: var(--tinta-clara-2); }
.cuerpo-panel { display: flex; flex-direction: column; gap: var(--e-4); }
.cuerpo-panel .lista > li { padding: var(--e-3) 0; }
.cuerpo-panel .lista button { all: unset; cursor: pointer; display: contents; }
.cuerpo-panel .lista li[aria-current="true"] .texto { color: var(--azul-sobre-negro); }
.cuerpo-panel .lista li:focus-within { outline: 2px solid var(--azul-sobre-negro); outline-offset: 2px; border-radius: 8px; }
.cuerpo-datos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--e-3); margin: var(--e-3) 0; }
@media (max-width: 900px) { .cuerpo-rejilla { grid-template-columns: minmax(0, 1fr); } .visor { min-height: 420px; } }

/* ================================================================ 7. BOTONES Y ENLACES
   Responden al presionar (no al soltar): se encogen un poco en 100 ms. */
.boton {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--e-2);
  min-height: 44px; padding: 11px 22px; border: 0; border-radius: var(--radio-pildora);
  background: var(--azul); color: #fff; font-size: var(--t-cuerpo); font-weight: 400; text-decoration: none; cursor: pointer;
  transition: background-color .2s, transform .1s;
}
.boton:hover { background: var(--azul-hover); }
.boton:active { transform: scale(.97); }
.boton:disabled { opacity: .4; cursor: default; transform: none; }
.boton--secundario { background: transparent; color: var(--azul); box-shadow: inset 0 0 0 1px var(--azul); }
.boton--secundario:hover { background: rgba(0, 113, 227, .06); }
.seccion--negra .boton--secundario { color: var(--azul-sobre-negro); box-shadow: inset 0 0 0 1px var(--azul-sobre-negro); }
.boton--pequeno { min-height: 32px; padding: 6px 14px; font-size: var(--t-pequeno); }
.enlace { display: inline; padding: 0; border: 0; background: none; color: var(--azul-enlace); font-size: inherit; text-decoration: none; cursor: pointer; }
.enlace:hover { text-decoration: underline; }
.enlace::after { content: "\00a0›"; }
.enlace--simple::after { content: none; }
.seccion--negra .enlace { color: var(--azul-sobre-negro); }

/* ================================================================ 8. CONTROL SEGMENTADO (elegir una opción) */
.segmentado { display: inline-flex; flex-wrap: nowrap; max-width: 100%; overflow-x: auto; scrollbar-width: none; gap: 2px; padding: 3px; border-radius: var(--radio-pildora); background: rgba(0, 0, 0, .06); }
.segmentado::-webkit-scrollbar { display: none; }
.segmentado button {
  flex: none; white-space: nowrap; border: 0; background: transparent; padding: 8px 18px; border-radius: var(--radio-pildora);
  font-size: var(--t-pequeno); color: var(--tinta); cursor: pointer; transition: background-color .2s, transform .1s;
}
.segmentado button:active { transform: scale(.97); }
.segmentado button[aria-pressed="true"] { background: var(--blanco); box-shadow: 0 1px 4px rgba(0, 0, 0, .12); font-weight: 600; }
.seccion--negra .segmentado { background: rgba(255, 255, 255, .12); }
.seccion--negra .segmentado button { color: var(--tinta-clara); }
.seccion--negra .segmentado button[aria-pressed="true"] { background: rgba(255, 255, 255, .92); color: var(--tinta); }

/* ================================================================ 9. SEMÁFORO */
.estado { display: inline-flex; align-items: center; gap: 7px; font-size: var(--t-pequeno); font-weight: 600; }
.estado::before { content: ""; flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--gris-estado); }
.estado--verde    { color: var(--verde-texto); }    .estado--verde::before    { background: var(--verde); }
.estado--amarillo { color: var(--amarillo-texto); } .estado--amarillo::before { background: var(--amarillo); }
.estado--rojo     { color: var(--rojo-texto); }     .estado--rojo::before     { background: var(--rojo); }
.estado--gris     { color: var(--tinta-3); }
.seccion--negra .estado--verde { color: var(--verde); }
.seccion--negra .estado--amarillo { color: var(--amarillo); }
.seccion--negra .estado--rojo { color: #ff6961; }

/* ================================================================ 10. LISTAS */
.lista { list-style: none; margin: 0; padding: 0; }
.lista > li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--e-1) var(--e-4); align-items: center; padding: var(--e-4) 0; border-top: 1px solid var(--linea-suave); }
.lista > li:first-child { border-top: 0; }
.seccion--negra .lista > li { border-color: var(--linea-oscura); }

/* ================================================================ 11. FORMULARIOS */
.formulario { display: grid; gap: var(--e-6); }
.formulario-filas { display: grid; gap: var(--e-4) var(--e-5); grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.campo { display: grid; gap: 6px; align-content: start; }
.campo label { font-size: var(--t-pequeno); font-weight: 500; }
.campo input, .campo select, .campo textarea {
  width: 100%; min-height: 44px; padding: 10px 14px; border-radius: var(--radio-control);
  border: 1px solid var(--linea); background: var(--blanco); transition: border-color .15s, box-shadow .15s;
}
.campo input:focus, .campo select:focus, .campo textarea:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 4px rgba(0, 113, 227, .15); }
.campo .ayuda { font-size: var(--t-nota); color: var(--tinta-3); }
.campo .error { font-size: var(--t-nota); color: var(--rojo-texto); }
.campo[data-error] input, .campo[data-error] select { border-color: var(--rojo); }

/* ================================================================ 12. AVISOS (los 4 tipos: estado, completado, advertencia, error) */
.aviso {
  position: fixed; left: 50%; bottom: 28px; z-index: 100; display: flex; align-items: center; gap: var(--e-2);
  padding: 12px 20px; border-radius: var(--radio-pildora); font-size: var(--t-pequeno);
  background: var(--material-oscuro); color: #fff; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  opacity: 0; transform: translate(-50%, 16px) scale(.98); pointer-events: none; transition: opacity .25s, transform .25s;
}
.aviso.visible { opacity: 1; transform: translate(-50%, 0) scale(1); }
.aviso::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gris-estado); }
.aviso--completado::before { background: var(--verde); }
.aviso--advertencia::before { background: var(--amarillo); }
.aviso--error::before { background: var(--rojo); }

/* ================================================================ 13. PIE */
.pie { padding: var(--e-6) 0 var(--e-10); border-top: 1px solid var(--linea-suave); background: var(--fondo); font-size: var(--t-nota); color: var(--tinta-3); }

/* ================================================================ 14. PANTALLA DE ENTRADA (SeccionAcceso.html) */
:root {
  /* Colores del logo de Sinergia Cósmica: solo para la marca y los avatares */
  --marca-azul: #1f56c8;
  --marca-morado: #6b46c1;
  --marca-turquesa: #1c9a99;
  --marca-tinta: #0f1f4b;
}
.vista[hidden] { display: none !important; }
.acceso { min-height: 100vh; background: var(--blanco); padding: clamp(40px, 6vw, 72px) 0 var(--e-16); }
.acceso .contenedor { display: grid; gap: var(--e-6); justify-items: center; text-align: center; }
.logo { width: clamp(150px, 18vw, 210px); height: auto; }
.acceso .subtitulo { max-width: 640px; }

.perfiles { width: 100%; display: grid; gap: var(--e-5); grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-top: var(--e-6); }
.perfil {
  display: grid; justify-items: center; gap: var(--e-2); padding: var(--e-8) var(--e-6);
  background: var(--fondo); border: 0; border-radius: var(--radio-tarjeta); text-align: center; cursor: pointer;
  transition: transform .1s, box-shadow .2s, background-color .2s;
}
.perfil:hover { background: #ededf0; }
.perfil:active { transform: scale(.98); }
.perfil .enlace { margin-top: var(--e-2); font-size: var(--t-pequeno); }
.avatar {
  width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center; margin-bottom: var(--e-2);
  font-size: 1.75rem; font-weight: 600; letter-spacing: -0.02em; color: #fff; background: var(--marca-azul);
}
.avatar--1 { background: var(--marca-azul); }
.avatar--2 { background: var(--marca-morado); }
.avatar--0 { background: var(--marca-turquesa); }
@media (max-width: 600px) {
  .perfiles { gap: var(--e-3); }
  .perfil { grid-template-columns: 56px minmax(0, 1fr); justify-items: start; text-align: left; column-gap: var(--e-4); row-gap: 2px; padding: var(--e-4) var(--e-5); border-radius: 20px; }
  .perfil .avatar { grid-row: span 4; width: 56px; height: 56px; font-size: 1.25rem; margin: 0; align-self: center; }
  .perfil .titulo-tarjeta { font-size: 1.1875rem; }
  .perfil .enlace { margin-top: 0; }
}
.perfil-nuevo { background: transparent; box-shadow: inset 0 0 0 1.5px var(--linea); }
.perfil-nuevo:hover { background: var(--fondo); }
.perfil-nuevo .avatar { background: var(--fondo); color: var(--azul); font-weight: 400; font-size: 2.5rem; }

.hoja { width: 100%; max-width: 760px; text-align: left; background: var(--fondo); }
.hoja-cabecera { display: flex; justify-content: space-between; align-items: baseline; gap: var(--e-4); }

/* Barra superior del panel: astronauta activo y botón para cambiarlo */
.nav-astronauta { display: inline-flex; align-items: center; gap: var(--e-2); font-size: var(--t-nota); color: var(--tinta-2); white-space: nowrap; }
.nav-astronauta .avatar { width: 24px; height: 24px; margin: 0; font-size: 10px; }

/* ================================================================ 15. PERFIL: avatar con emoji y ventana de edición (FormPerfil.html) */
.avatar--emoji { background: var(--fondo); color: inherit; font-size: 3rem; line-height: 1; }
.avatar--grande { width: 112px; height: 112px; font-size: 3.75rem; margin: 0 0 var(--e-2); }
.avatar--grande.avatar--0, .avatar--grande.avatar--1, .avatar--grande.avatar--2 { font-size: 2.5rem; }
.seccion--gris .avatar--emoji, .hero .avatar--emoji { background: var(--fondo); }
.nav-astronauta .avatar--emoji { font-size: 15px; background: transparent; }
/* Avatar serio: busto de astronauta con casco (JsAvatares.html). La ilustración trae su propio fondo. */
.avatar--serio { display: block; padding: 0; overflow: hidden; background: transparent; }
.avatar--serio svg { display: block; width: 100%; height: 100%; }
.emoji-opcion .avatar--serio { width: 40px; height: 40px; margin: 0; border-radius: 50%; }

.dialogo {
  width: min(760px, 100% - 32px); max-height: min(92vh, 900px); padding: 0; border: 0; border-radius: var(--radio-tarjeta);
  background: var(--blanco); color: var(--tinta); box-shadow: 0 24px 80px rgba(0, 0, 0, .25);
}
.dialogo::backdrop { background: rgba(0, 0, 0, .32); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.dialogo[open] { animation: dialogo-entra .28s cubic-bezier(.2, .8, .2, 1); }
@keyframes dialogo-entra { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: none; } }
.dialogo .formulario { padding: clamp(24px, 4vw, 40px); }
.selector-emoji { border: 0; margin: 0; padding: 0; display: grid; gap: var(--e-2); }
.campo-leyenda { font-size: var(--t-pequeno); font-weight: 500; padding: 0; margin-bottom: var(--e-2); }
.emojis { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: var(--e-2); }

.alr-lista { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--e-4); }
.alr-alerta { display: grid; gap: var(--e-2); align-content: start; padding: var(--e-5); border-radius: 20px; background: var(--fondo); border-left: 4px solid var(--amarillo); }
.alr-alerta--rojo { border-left-color: var(--rojo); }
.alr-alerta-cabeza { display: flex; justify-content: space-between; align-items: baseline; gap: var(--e-3); flex-wrap: wrap; }

.alr-acciones { display: flex; flex-wrap: wrap; gap: var(--e-2); margin-top: var(--e-2); }
.alr-vacio { padding: var(--e-5); border-radius: 20px; background: var(--fondo); grid-column: 1 / -1; }

@media (max-width: 1000px) { .alr-planes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .alr-lista, .alr-planes, .alr-pie { grid-template-columns: 1fr; }
  .alr-intervenciones li { flex-direction: column; gap: 4px; } .alr-intervenciones li > .nota { text-align: left; max-width: none; }
}

/* ==========================================================================
   21. Evolución semana a semana (SeccionEvolucion)
   ========================================================================== */
.evo-controles { display: grid; justify-items: center; gap: var(--e-3); margin-bottom: var(--e-6); text-align: center; }
.evo-rejilla { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--e-4); }

.evo-svg { width: 100%; height: auto; display: block; overflow: visible; touch-action: pan-y; }

.evo-punto--verde { fill: var(--verde); } .evo-punto--amarillo { fill: var(--amarillo); } .evo-punto--rojo { fill: var(--rojo); } .evo-punto--gris { fill: #c7c7cc; }
.evo-guia { stroke: var(--tinta-3); stroke-width: 1; opacity: .35; }
.evo-vacio { min-height: 160px; display: grid; place-items: center; }
.evo-tooltip { position: absolute; z-index: 30; pointer-events: none; display: grid; gap: 2px; padding: 10px 12px; border-radius: 12px; background: var(--blanco); box-shadow: 0 6px 24px rgba(0, 0, 0, .14); min-width: 170px; }
.evo-tabla-bloque { margin-top: var(--e-6); }
.evo-tabla-bloque summary { cursor: pointer; display: inline-block; margin-bottom: var(--e-3); }
.evo-tabla { background: var(--blanco); border-radius: 16px; }
.evo-tabla caption { text-align: left; padding: 0 0 var(--e-2); }
@media (max-width: 1000px) { .evo-rejilla { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .evo-rejilla { grid-template-columns: 1fr; } }

@media (prefers-contrast: more) {
  :root { --tinta-2: #3a3a3c; --tinta-3: #48484a; --linea: #8e8e93; --linea-suave: rgba(0, 0, 0, .3); }
  .barra-superior { background: var(--blanco); backdrop-filter: none; -webkit-backdrop-filter: none; }

}

/* ================================================================ 99. AJUSTES DE UX/UI (auditoría del 14-nov) */
details > summary { cursor: pointer; }
/* Listas de texto corrido (no filas de etiqueta + valor) */
.lista--texto > li { display: block; }
ol.lista--texto { list-style: decimal; padding-left: 1.2em; }
ol.lista--texto > li { display: list-item; padding: var(--e-2) 0; border-top: 0; }
/* Tablas */
.tabla-scroll { overflow-x: auto; margin-top: var(--e-4); }
.tabla { width: 100%; border-collapse: collapse; text-align: left; }
.tabla th { font-size: var(--t-pequeno); font-weight: 600; color: var(--tinta-2); padding: var(--e-2) var(--e-4) var(--e-3) 0; border-bottom: 1px solid var(--linea); text-align: left; }
.tabla td { padding: var(--e-3) var(--e-4) var(--e-3) 0; border-bottom: 1px solid var(--linea-suave); vertical-align: top; }
.tabla tr:last-child td { border-bottom: 0; }
/* Contraste: notas sobre fondo negro y botón secundario sobre gris */
.seccion--negra .nota, .seccion--negra .texto-3 { color: var(--tinta-clara-2); }
.boton--secundario { color: var(--azul-enlace); }
/* Alertas: el nivel se ve de un vistazo */
.tarjeta[data-nivel="rojo"] { border-left: 4px solid var(--rojo); }
.tarjeta[data-nivel="amarillo"] { border-left: 4px solid var(--amarillo); }
@media (max-width: 640px) {
  .segmentado button { min-height: 44px; }
  .boton--pequeno { min-height: 44px; padding: 10px 16px; }

  form .boton[type="submit"] { width: 100%; }
}

/* ---- Carga del visor 3D: imagen de anatomía al instante y barra de progreso ---- */
.visor-poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: .4; pointer-events: none; }
.visor-carga .texto, .visor-barra { position: relative; z-index: 1; }
.visor-barra { width: min(260px, 70%); height: 4px; border-radius: 2px; background: var(--linea-oscura); overflow: hidden; }
.visor-barra i { display: block; height: 100%; width: 0; background: var(--azul-sobre-negro); transition: width .25s; }

/* ---- Plegables de la auditoría de móvil ---- */
details.tarjeta > summary { min-height: 44px; display: flex; align-items: center; }
.alr-colapso > summary { min-height: 44px; display: flex; align-items: center; color: var(--azul-enlace); }
.segmentado--envuelve { flex-wrap: wrap; border-radius: 18px; justify-content: center; }

/* ================================================================ 100. TABLERO (una vista a la vez)
   Escritorio: barra lateral. Celular: barra superior + barra inferior de pestañas con "Más". */
.tablero { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; background: var(--fondo); }
.barra-lateral { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: var(--e-4); padding: var(--e-5) var(--e-4); background: var(--blanco); border-right: 1px solid var(--linea-suave); overflow-y: auto; }
.barra-lateral .nav-marca { margin: 0; }
.barra-lateral .nav-etiqueta { align-self: flex-start; }
.nav-astronauta { display: flex; align-items: center; gap: var(--e-3); font-size: var(--t-pequeno); font-weight: 600; }
.nav-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.barra-lateral .nav-lista { flex: 1; align-content: start; }
.nav-item { position: relative; display: flex; align-items: center; gap: var(--e-3); min-height: 44px; padding: 0 var(--e-3); border-radius: 12px; color: var(--tinta-2); text-decoration: none; font-size: var(--t-pequeno); font-weight: 500; }
.nav-item:hover { background: var(--fondo); color: var(--tinta); }
.nav-item[aria-current="page"], .tab[aria-current="page"] { color: var(--azul-enlace); }
.nav-item[aria-current="page"] { background: rgba(0, 102, 204, .1); font-weight: 600; }
.nav-badge { margin-left: auto; min-width: 22px; padding: 1px 7px; border-radius: 999px; background: var(--rojo-texto); color: #fff; font-size: var(--t-nota); font-weight: 700; text-align: center; }
.tablero-cuerpo { min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
.tablero-cuerpo main { flex: 1; }
.barra-superior, .barra-inferior, .hoja-mas { display: none; }
/* Las vistas pierden el aire de "página": cabeceras a la izquierda y menos relleno */
.tablero .seccion { padding: var(--e-8) 0 var(--e-10); }
.tablero .seccion-cabecera { text-align: left; justify-items: start; margin: 0 0 var(--e-6); max-width: none; }
.tablero .seccion-cabecera .titulo { font-size: clamp(1.75rem, 3vw, 2.5rem); }
.tablero .contenedor { width: min(1180px, 100% - 48px); }
.tablero .contenedor--ancho { width: min(1280px, 100% - 48px); }
/* Vista "Hoy" */
.hoy-cabecera { display: flex; flex-wrap: wrap; gap: var(--e-4); align-items: end; justify-content: space-between; }
.hoy-titulo { font-size: clamp(1.5rem, 2.4vw, 2rem); }
.tablero .seccion.hoy { padding-bottom: var(--e-6); }
.tablero .hoy + .seccion { padding-top: 0; }
.hoy-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--e-4); }
.hoy-cifra { font-size: clamp(1.75rem, 3vw, 2.5rem); }
.hoy-kpi[data-nivel="rojo"] .hoy-cifra { color: var(--rojo-texto); } .hoy-kpi[data-nivel="amarillo"] .hoy-cifra { color: var(--amarillo-texto); } .hoy-kpi[data-nivel="verde"] .hoy-cifra { color: var(--verde-texto); }
.hoy-rejilla { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: var(--e-4); align-items: start; }
.hoy-musculos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--e-3); }
.hoy-musculo { display: grid; gap: 4px; align-content: start; padding: var(--e-4); border-radius: 16px; background: var(--fondo); color: inherit; text-decoration: none; border-left: 4px solid var(--linea); }
.hoy-musculo:hover { background: #ececf0; }
.hoy-musculo[data-nivel="verde"] { border-left-color: var(--verde); } .hoy-musculo[data-nivel="amarillo"] { border-left-color: var(--amarillo); } .hoy-musculo[data-nivel="rojo"] { border-left-color: var(--rojo); }
.hoy-puntaje { font-size: 1.75rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; } .hoy-puntaje small { font-size: .5em; margin-left: 2px; }
.hoy-alerta { display: grid; gap: 4px; padding: var(--e-3) var(--e-4); border-radius: 14px; background: var(--fondo); border-left: 4px solid var(--amarillo); }
.hoy-alerta[data-nivel="rojo"] { border-left-color: var(--rojo); }
.hoy-plan { display: grid; gap: 2px; padding-top: var(--e-3); border-top: 1px solid var(--linea-suave); }
.nota--centro { text-align: center; }

@media (max-width: 899px) {
  .tablero { grid-template-columns: minmax(0, 1fr); }
  .barra-lateral { display: none; }
  .tablero-cuerpo { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
  .barra-superior { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: var(--e-2); height: 52px; padding: 0 var(--e-4); background: var(--material-claro); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--linea-suave); }
  .barra-superior .nav-marca { margin-right: auto; }
  .barra-superior .nav-etiqueta { font-size: var(--t-nota); }
  .nav-cambiar-m { min-height: 44px; min-width: 44px; font-size: var(--t-pequeno); }
  #nav-nombre-m { display: none; }
  .barra-inferior { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; height: calc(64px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--blanco); border-top: 1px solid var(--linea); }
  .tab { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; background: transparent; color: var(--tinta-2); text-decoration: none; font-size: var(--t-nota); font-weight: 500; cursor: pointer; }
  .tab span:not(.nav-badge) { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab[data-activa] { color: var(--azul-enlace); }
  .tab[hidden] { display: none; }
  .tab .nav-badge { position: absolute; top: 4px; left: 54%; margin: 0; min-width: 18px; padding: 0 5px; font-size: 11px; }
  .hoja-mas { position: fixed; left: var(--e-3); right: var(--e-3); bottom: calc(72px + env(safe-area-inset-bottom)); z-index: 60; padding: var(--e-2); background: var(--blanco); border-radius: 18px; box-shadow: 0 8px 32px rgba(0, 0, 0, .22); }
  .hoja-mas:not([hidden]) { display: block; }
  .hoja-mas[hidden] { display: none; }
  .hoja-mas .nav-item { min-height: 52px; font-size: var(--t-cuerpo); }
  .tablero .seccion { padding: var(--e-6) 0 var(--e-8); }
  .tablero .contenedor, .tablero .contenedor--ancho { width: min(100% - 32px, 1180px); }
  .hoy-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hoy-rejilla { grid-template-columns: minmax(0, 1fr); }
  .hoy-musculos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* ================================================================ GUÍA DE LA BANDA (SeccionSensores.html, dentro del Monitoreo) */
.guia { width: min(920px, 100% - 32px); overflow-y: auto; }
.guia-hoja { display: grid; gap: var(--e-6); padding: clamp(20px, 3.5vw, 36px); }
.guia-cabecera { display: flex; justify-content: space-between; align-items: start; gap: var(--e-4); }
.guia-titulos { display: grid; gap: 6px; }
.guia-estado { display: flex; flex-wrap: wrap; align-items: center; gap: var(--e-3); }
.guia-cerrar { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--fondo); color: var(--tinta-2); cursor: pointer; }
.guia-cerrar:hover { background: #e8e8ed; color: var(--tinta); }
.guia-cuerpo { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: var(--e-6); align-items: start; }
.guia-figura { margin: 0; display: grid; gap: var(--e-2); }
.guia-figura svg { width: 100%; aspect-ratio: 290 / 348; border-radius: 20px; background: var(--fondo); }
.guia-leyenda { font-size: var(--t-pequeno); font-weight: 600; min-height: 1.4em; }
.guia-controles { display: flex; justify-content: space-between; align-items: baseline; gap: var(--e-3); }
.guia-pasos { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.guia-pasos button { width: 100%; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: var(--e-3); align-items: start; padding: var(--e-3); border: 0; border-radius: 14px; background: none; font: inherit; color: var(--tinta); text-align: left; cursor: pointer; transition: background .2s; }
.guia-pasos button > span:last-child { display: grid; gap: 2px; }
.guia-pasos button:hover { background: var(--fondo); }
.guia-pasos li[aria-current] button { background: var(--fondo); }
.guia-num { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--fondo); color: var(--tinta-2); font-size: var(--t-nota); font-weight: 600; transition: background .25s, color .25s; }
.guia-pasos li[aria-current] .guia-num { background: var(--azul); color: #fff; }
.guia-pasos li.es-hecho .guia-num { background: var(--verde-fondo); color: var(--verde-texto); }
.guia-subtitulo { font-size: 1.1875rem; }
.guia-funciona { display: grid; gap: var(--e-3); padding-top: var(--e-5); border-top: 1px solid var(--linea-suave); }
.guia-mide { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--e-4); }
.guia-mide-item { display: grid; gap: 4px; align-content: start; }
.guia-pie { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--e-4); }
.guia-pie .nota { max-width: 46ch; }

/* Dibujo: cada elemento aparece en su paso (data-paso del svg) */
.guia-fondo { fill: var(--fondo); }
.guia-musculo { opacity: .6; }
.guia-piel { fill: rgba(0, 113, 227, .12); stroke: var(--azul); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; transition: opacity .4s; }
.guia-linea { stroke: var(--tinta); stroke-width: .9; stroke-dasharray: 3 3; opacity: 0; transition: opacity .4s; }
.guia-cruz { stroke: var(--rojo); stroke-width: 1.6; stroke-linecap: round; fill: none; opacity: 0; transition: opacity .4s; }
.guia-electrodo { fill: #d4a017; stroke: #fff; stroke-width: .9; opacity: 0; transform-box: fill-box; transform-origin: center; transform: scale(.2); transition: opacity .35s, transform .35s cubic-bezier(.2, .8, .2, 1.4); }
.guia-electrodo--encima { fill: none; stroke: #f5c542; stroke-width: .9; }
.guia-banda { opacity: 0; transform: translateX(var(--desde)); transition: opacity .5s, transform .7s cubic-bezier(.2, .8, .2, 1); }
.guia-tela { fill: rgba(29, 29, 31, .78); }
.guia-modulo { fill: #2c2c2e; stroke: #48484a; stroke-width: .8; }
.guia-luz { fill: #636366; transition: fill .3s; }
.guia-luz-pulso { fill: none; stroke: var(--verde); stroke-width: 1.2; opacity: 0; transform-box: fill-box; transform-origin: center; }
[data-paso="1"] .guia-piel, [data-paso="2"] .guia-piel { opacity: 1; }
[data-paso="2"] .guia-linea, [data-paso="3"] .guia-linea { opacity: 1; }
[data-paso="2"] .guia-cruz { opacity: 1; }
[data-paso="3"] .guia-electrodo:not(.guia-electrodo--encima), [data-paso="4"] .guia-electrodo:not(.guia-electrodo--encima), [data-paso="5"] .guia-electrodo:not(.guia-electrodo--encima) { opacity: 1; transform: scale(1); }
[data-paso="4"] .guia-electrodo--encima, [data-paso="5"] .guia-electrodo--encima { opacity: 1; transform: scale(1); }
[data-paso="4"] .guia-banda, [data-paso="5"] .guia-banda { opacity: 1; transform: none; }
[data-paso="5"] .guia-luz { fill: var(--verde); }
@media (prefers-reduced-motion: no-preference) {
  [data-paso="1"] .guia-piel { animation: guia-limpiar 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  [data-paso="5"] .guia-luz { animation: guia-calibrar 3.2s steps(1) forwards; }
  [data-paso="5"] .guia-luz-pulso { animation: pulso 1.4s ease-out 1.6s infinite; }
}
@keyframes guia-limpiar { 0%, 100% { transform: scale(.85); } 50% { transform: scale(1.08); } }
@keyframes guia-calibrar { 0% { fill: var(--azul); } 15% { fill: #636366; } 30% { fill: var(--azul); } 45% { fill: #636366; } 50%, 100% { fill: var(--verde); } }
@media (prefers-reduced-motion: reduce) {
  .guia-piel, .guia-linea, .guia-cruz, .guia-electrodo, .guia-banda { transition: none; }
}

.mon-bandas-info { margin-top: var(--e-6); }
.mon-bandas-info > summary { cursor: pointer; }

@media (max-width: 760px) {
  .guia { width: 100%; max-width: 100%; max-height: 92vh; margin: auto auto 0; border-radius: 24px 24px 0 0; }
  .guia-cuerpo { grid-template-columns: minmax(0, 1fr); }
  .guia-figura { max-width: 300px; justify-self: center; width: 100%; }
  .guia-mide { grid-template-columns: minmax(0, 1fr); }
  .guia-pie .boton { width: 100%; min-height: 44px; }
}

/* ---- Correcciones tras la auditoría del tablero ---- */
