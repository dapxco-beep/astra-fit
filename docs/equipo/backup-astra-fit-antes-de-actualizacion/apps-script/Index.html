  <!-- ===================== VISTA 2: panel del astronauta elegido ===================== -->

    <nav class="nav" aria-label="Secciones">
      <div class="contenedor">
        <a class="nav-marca" href="#inicio">ASTRA-FIT</a>
        <a class="nav-enlace" href="#cuerpo">Cuerpo</a>
        <a class="nav-enlace" href="#evolucion">Evolución</a>
        <a class="nav-enlace" href="#alertas">Alertas</a>
        <a class="nav-enlace" href="#registro">Registro</a>
        <span class="nav-astronauta"><span class="avatar" id="nav-avatar" aria-hidden="true"></span><span id="nav-nombre"></span></span>

    <footer class="pie">
      <div class="contenedor">
        Prototipo de Sinergia Cósmica para NASA Space Apps Challenge 2026, con datos simulados. Las alertas son indicadores de seguimiento, no diagnósticos médicos.
      </div>
    </footer>
  </div>

  <script>
    /* Barra superior: muestra quién está activo */
    document.addEventListener('astronauta-elegido', (e) => {
      const a = e.detail;
      const n = parseInt(String(a.id_astronauta).replace(/\D/g, ''), 10) || 0;
      const avatar = document.getElementById('nav-avatar');
      avatar.className = `avatar avatar--${n % 3}`;
      avatar.textContent = String(a.nombre).trim().slice(0, 1).toUpperCase();
      document.getElementById('nav-nombre').textContent = a.nombre;
    });
  </script>
</body>
